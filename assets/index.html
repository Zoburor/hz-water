/* notes 可能是数组, 也可能是整段字符串, 两种都吃 */
function clNotesOf(ver, meta){
  var e = CHANGELOG[String(ver || '')] || null;
  var out = { ver:String(ver || ''), date:'', notes:[] };
  if(meta){
    if(meta.released || meta.date) out.date = String(meta.released || meta.date);
    var n = meta.notes || meta.changes || meta.log;
    if(n){
      if(Object.prototype.toString.call(n) === '[object Array]') out.notes = n.map(String);
      else out.notes = String(n).split(/\n+/).filter(function(x){ return x.trim(); });
    }
  }
  if(!out.notes.length && e){
    out.notes = e.notes.slice();
    if(!out.date) out.date = e.date;
  }
  return out;
}

function clHTML(ver, meta){
  var o = clNotesOf(ver, meta);
  if(!o.notes.length) return '';
  var h = '<div class="card" style="margin-top:9px"><h2>更新日志 '
    + badge('v' + (o.ver || '?')) + (o.date ? (' <span class="pill">' + esc(o.date) + '</span>') : '')
    + '</h2>';
  h += '<ul style="margin:4px 0 0 18px;padding:0">';
  o.notes.forEach(function(x){
    h += '<li style="margin:5px 0;line-height:1.55">' + esc(String(x)) + '</li>';
  });
  h += '</ul></div>';
  return h;
}

/* 按钮下面那块: 有新版摊新版, 没有就摊当前这版 */
function updPaintNotes(){
  var box = $('updNotes');
  if(!box) return;
  var st = UPD.state || 'idle';
  if(st === 'checking'){ box.innerHTML = ''; return; }
  if(st === 'update' && UPD.remote){
    box.innerHTML = clHTML(UPD.remote, UPD.remoteMeta);
    return;
  }
  box.innerHTML = clHTML(APP_VER, null);
}

var UPD_TEXT = {
  idle:'检查更新',
  checking:'检查版本中...',
  latest:'现在是最新版本',
  update:'可用更新 点击下载',
  error:'检查失败 点击重试'
};

function updCheckLabel(){
  if(UPD.state === 'update' && UPD.remote) return '可用更新 v' + UPD.remote + ' 点击下载';
  return UPD_TEXT[UPD.state] || UPD_TEXT.idle;
}

/* 只重画按钮与说明, 不整体 paint(), 免得把页面滚动位置弹回去 */
function updPaintCheck(){
  var box = $('updCheckWrap');
  if(!box) return;
  var st = UPD.state || 'idle';
  var cls = 'btn-b btn-f';
  if(st === 'update') cls = 'btn-p';
  if(st === 'latest') cls = 'btn-f';
  if(st === 'error') cls = 'btn-f';
  var dis = (st === 'checking') ? ' disabled' : '';
  var op = (st === 'checking') ? ';opacity:.6' : '';
  box.innerHTML = '<button class="' + cls + '" id="updCheck"' + dis
    + ' style="width:100%' + op + '">' + esc(updCheckLabel()) + '</button>';
  var b = $('updCheck');
  if(b) b.onclick = updCheckTap;

  var meta = $('updCheckMeta');
  if(!meta) return;
  var sub = '';
  if(st === 'checking'){
    sub = '正在读远端版本号: 依次试 4 个镜像, 全不通再回落 GitHub API. 慢是正常的, 不弹窗也不打断你.';
  }else if(st === 'latest'){
    /* 远端比本地旧也算 latest(没有可用更新), 所以不能一律写"一致". */
    sub = (UPD.remote === APP_VER)
      ? ('远端 v' + UPD.remote + ' 与本地 v' + APP_VER + ' 一致, 一个字节都没下.')
      : ('远端 v' + UPD.remote + ' 不比本地 v' + APP_VER + ' 新, 一个字节都没下.');
  }else if(st === 'update'){
    sub = '远端 v' + UPD.remote + ' 比本地 v' + APP_VER + ' 新. 再点一次按钮才下载, 下完交给系统安装器.';
  }else if(st === 'error'){
    sub = UPD.msg || '没读到远端版本号, 过一会儿再点一次.';
  }else{
    sub = UPD.lastCheck ? ('上次检查 ' + ts2s(UPD.lastCheck)) : '还没查过';
  }
  meta.innerHTML = '<div class="sub" style="margin-top:6px">' + esc(sub) + '</div>';
  updPaintNotes();
}

function updCheckTap(){
  var st = UPD.state || 'idle';
  if(st === 'checking') return;
  if(st === 'update' && UPD.remote){ doUpdate(UPD.remote); return; }
  checkUpdate();
}

function checkUpdate(){
  if(!REPO){
    UPD.state = 'error';
    UPD.msg = '还没配仓库地址, 更新链路是空的.';
    updPaintCheck();
    return;
  }
  if(UPD.checking) return;
  UPD.checking = true; UPD.state = 'checking'; UPD.msg = ''; UPD.results = {}; UPD.done = false;
  updPaintCheck();
  log('先读远端版本号...');
  fetchRemoteVer(function(tag, err, meta){
    function afterApi(){
      UPD.checking = false; UPD.done = true; UPD.lastCheck = Date.now(); verSave();
      if(!tag){
        log('读不到远端版本: ' + err, 'w');
        UPD.state = 'error';
        UPD.msg = '四个镜像与 GitHub API 都没读到版本号: ' + String(err || '').slice(0, 120);
        updPaintCheck();
        return;
      }
      UPD.remote = tag;
      UPD.remoteMeta = meta || null;
      log('远端版本 v' + tag + ', 本地 v' + APP_VER);
      if(cmpVer(tag, APP_VER) <= 0){
        log('已经是最新的, 不下载', 's');
        UPD.state = 'latest';
        updPaintCheck();
        return;
      }
      log('发现新版 v' + tag + ', 等用户点按钮再下载');
      UPD.state = 'update';
      updPaintCheck();
      toast('有新版本 v' + tag + ', 点按钮下载');
    }
    if(tag){ afterApi(); return; }
    log('镜像都失败, 回落到 GitHub API', 'w');
    nreq('GET', 'https://api.github.com/repos/' + REPO + '/releases/latest',
         { 'Accept': 'application/vnd.github+json' }, '').then(function(r){
      var j = jparse(r.text);
      tag = (j && j.tag_name) ? String(j.tag_name).replace(/^v/i, '') : null;
      if(!tag) err = (err || '') + ' / API ' + (r.err || ('HTTP ' + r.status));
      afterApi();
    }, function(){
      afterApi();
    });
  });
}

/* 用原生 HTTP 发一个 Range: bytes=0-1 的小请求, 只看状态码与 Content-Length */
/* 只有在版本比对确认"确实有新版本"之后才会走到这里. */
function doUpdate(tag){
  if(!HASNATIVE){ toast('网页版不能自己装包'); return; }
  UPD.checking = true; UPD.results = {};
  UPD.state = 'idle'; UPD.msg = '';
  updPaintCheck();
  var left = UPDATE_SOURCES.length;
  var urls = [];
  log('探测 ' + UPDATE_SOURCES.length + ' 个源');
  UPDATE_SOURCES.forEach(function(src){
    probeHead(src.url, function(ok, info){
      UPD.results[src.id] = { ok:ok, info:info };
      if(ok) urls.push(src.url);
      log((ok?'源可用: ':'源不可用: ') + src.name + ' - ' + info, ok?'s':'w');
      left--;
      if(left === 0){
        UPD.checking = false;
        if(!urls.length){ alertBox('没有可用的源', '所有镜像都探不通, 稍后再试.'); paint(); return; }
        log('开始下载 v' + tag + ', ' + urls.length + ' 个源');
        window.__hzCb['upd'] = function(x){
          log('下载结果: ' + JSON.stringify(x), x && x.ok ? 's' : 'w');
          /* 缺"安装未知应用"权限: 包已经下好了, 只差授权. 之前这个分支根本没人接,
             因为原生侧的 reqId 是 null, 提示被静默丢弃 -> 用户看到"下载完了没反应". */
          if(x && x.needInstallPerm){
            window.__hzPendingInstall = 'updp';
            window.__hzCb['updp'] = function(y){
              log('续装结果: ' + JSON.stringify(y), y && y.ok ? 's' : 'w');
              if(y && y.ok) toast('已拉起安装器');
              else if(y && y.needInstallPerm) toast('还是没给安装权限, 在设置里打开后再点"检查更新"');
              else toast('安装没起来, 稍后再试');
              paint();
            };
            toast('包已下好, 先去打开"允许安装未知应用"');
            try{ window.HzNative.installPerm('permi'); }
            catch(e){ log('打不开安装授权页: ' + e.message, 'w'); }
            paint();
            return;
          }
          if(x && x.ok){
            toast(x.launched ? '已拉起安装器' : '已下载, 点安装完成升级');
          }else{
            toast('下载失败, 换一个源再试');
          }
          paint();
        };
        try{
          try{ window.HzNative.updateClear(); }catch(e0){}
          updPollStart();
          window.HzNative.updateFrom('upd', urls.join(','));
        }
        catch(e){ log('调 updateFrom 失败: ' + e.message, 'r'); }
        paint();
      }
    });
  });
}

function probeHead(url, cb){
  var h = { 'Range':'bytes=0-1', 'Accept':'*/*' };
  nreq('GET', url, h, '').then(function(r){
    if(!r.status){ cb(false, r.err || '连不上'); return; }
    if(r.status === 206 || r.status === 200){
      cb(true, 'HTTP ' + r.status + (r.text ? (' / ' + r.text.length + 'B 已取') : ''));
      return;
    }
    /* 3xx: 源本身通, 只是把地址转给了 CDN. 下载那一步会跟随重定向, 所以算可用. */
    if(r.status === 301 || r.status === 302 || r.status === 303 || r.status === 307 || r.status === 308){
      cb(true, 'HTTP ' + r.status + ' 重定向(下载时会跟随)');
      return;
    }
    cb(false, 'HTTP ' + r.status);
  });
}

/* ---------- 需求5a: 下载进度 ----------
   原生 UpdateTask 一直在写静态快照(phase/got/total/srcIndex/...), 页面每 400ms 拉一次
   HzNative.updateProgress() 画进度条. 不用 __hzCb 回调, 因为 deliver() 是一次性的,
   拿它推进度会立刻把回调删掉. */
var UPD_POLL = { t:0, lastGot:0, lastAt:0, bps:0 };

function updFmtSize(n){
  n = Number(n) || 0;
  if(n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if(n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}

function updPhaseText(p){
  if(p === 'probe') return '正在探测下载源';
  if(p === 'download') return '正在下载';
  if(p === 'verify') return '正在校验安装包';
  if(p === 'install') return '已下好, 正在拉起安装器';
  if(p === 'fail') return '下载失败';
  return '空闲';
}

/* 只重画进度卡内部, 不整体 paint(), 避免打断用户操作 */
function updPaintProg(){
  var box = $('updProg');
  if(!box) return;
  var p = null;
  try{ if(HASNATIVE && window.HzNative.updateProgress) p = JSON.parse(window.HzNative.updateProgress() || 'null'); }catch(e){ p = null; }
  if(!p){ box.innerHTML = '<div class="empty">原生下载器不可用(网页版)</div>'; return; }

  var got = Number(p.got) || 0;
  var total = Number(p.total);
  var hasTotal = total > 0;
  var pct = hasTotal ? Math.min(100, Math.floor(got * 100 / total)) : 0;
  var phase = p.phase || 'idle';
  var now = Date.now();
  if(UPD_POLL.lastAt && now > UPD_POLL.lastAt && got >= UPD_POLL.lastGot){
    var dt = now - UPD_POLL.lastAt;
    var db = got - UPD_POLL.lastGot;
    if(dt >= 250){
      var b = db * 1000 / dt;
      UPD_POLL.bps = UPD_POLL.bps ? Math.round(UPD_POLL.bps * 0.6 + b * 0.4) : b;
      UPD_POLL.lastAt = now; UPD_POLL.lastGot = got;
    }
  }else if(!UPD_POLL.lastAt){ UPD_POLL.lastAt = now; UPD_POLL.lastGot = got; }

  var h = '';
  h += '<div class="row" style="justify-content:space-between;align-items:baseline">'
    + '<b style="font-size:15px">' + esc(updPhaseText(phase)) + '</b>'
    + '<span class="pill">' + (hasTotal ? (pct + '%') : (phase === 'download' ? '总大小未知' : '—')) + '</span></div>';
  h += '<div class="pbar' + (phase === 'install' ? ' done' : '') + '">'
    + '<i style="width:' + (hasTotal ? Math.max(2, pct) : (phase === 'download' ? 6 : (phase === 'idle' ? 0 : 30))) + '%"></i></div>';
  if(phase === 'download' || phase === 'verify' || got > 0){
    h += '<div class="sub" style="margin:2px 0 6px">'
      + esc(updFmtSize(got)) + (hasTotal ? (' / ' + esc(updFmtSize(total))) : '')
      + (UPD_POLL.bps > 0 && phase === 'download' ? (' · ' + esc(updFmtSize(UPD_POLL.bps)) + '/s') : '')
      + '</div>';
  }
  if(p.srcCount){
    h += '<div class="sub" style="margin:0 0 6px">源 ' + (Number(p.srcIndex) + 1) + '/' + Number(p.srcCount)
      + (p.url ? (' · <span style="word-break:break-all">' + esc(p.url) + '</span>') : '') + '</div>';
  }
  if(phase === 'fail' && p.err) h += '<div class="sub" style="color:var(--danger)">' + esc(p.err) + '</div>';
  if(phase === 'idle' && p.err) h += '<div class="sub">上一次: ' + esc(p.err) + '</div>';

  h += '<div class="row" style="margin-top:9px">'
    + '<button class="btn-b btn-f" id="updDir">打开下载目录</button>'
    + '<button class="btn-f" id="updRepo">打开项目仓库</button></div>';
  h += '<div class="sub">安装包下到应用缓存目录, 点"打开下载目录"会在公共"下载"里放一份并跳过去, '
    + '找不到时退回到系统的下载界面.</div>';

  box.innerHTML = h;
  if($('updDir')) $('updDir').onclick = openDownloadDir;
  if($('updRepo')) $('updRepo').onclick = function(){ openUrl(REPO_URL); };
}

function updPollStart(){
  updPollStop();
  UPD_POLL.lastAt = 0; UPD_POLL.lastGot = 0; UPD_POLL.bps = 0;
  updPaintProg();
  UPD_POLL.t = setInterval(function(){
    var p = null;
    try{ if(HASNATIVE && window.HzNative.updateProgress) p = JSON.parse(window.HzNative.updateProgress() || 'null'); }catch(e){ p = null; }
    updPaintProg();
    if(p && !p.running && (p.phase === 'install' || p.phase === 'fail' || p.phase === 'idle')){
      updPollStop();
    }
  }, 400);
}

function updPollStop(){
  if(UPD_POLL.t){ clearInterval(UPD_POLL.t); UPD_POLL.t = 0; }
}

/* 需求5b: 跳系统下载目录. 原生三级策略, 返回 ok 或失败原因. */

   ============================================================ */
var FM = { loc:null, locErr:null, stores:[], busy:false, loaded:false, err:null,
           cur:null, devs:[], devsBusy:false, devsErr:null, auto:false, kw:null, kwBusy:false };

/* 进入洗衣页时自动定位一次(有权限才做, 只做一次, 不后台轮询) */
function fmAuto(){
  if(FM.auto) return;
  FM.auto = true;
  var st = permState();
  if(!st.location) return;
  if(FM.loc) { fmLoad(); return; }
  doLocateQuiet();
}

function doLocateQuiet(){
  if(!HASNATIVE){
    if(!navigator.geolocation) return;
    webLocate(function(r){
      if(r.ok){
        FM.loc = { lat:r.lat, lng:r.lng, acc:r.acc, cached:false };
        FM.locErr = null;
        if(CUR === 'laundry') paint();
        fmLoad();
      }else{
        FM.locErr = r.err;
        if(CUR === 'laundry') paint();
      }
    });
    return;
  }
  window.__hzCb['locq'] = function(r){
    delete window.__hzCb['locq'];
    if(r && r.ok){
      FM.loc = { lat:r.lat, lng:r.lng, acc:r.acc, cached:!!r.cached };
      FM.locErr = null;
      log('自动定位: ' + r.lat.toFixed(5) + ', ' + r.lng.toFixed(5)
        + ' 精度 ' + Math.round(r.acc) + 'm', 's');
      if(CUR === 'laundry') paint();
      fmLoad();
    }else{
      FM.locErr = (r && r.err) || '定位失败';

function doLocate(){

/* 拉附近建筑: /api/v1/stores/nearby 为主, /api/v1/devices/nearby 兜底.
   两个都要求 JWT; 拿不到就把真实原因写出来, 不编造门店. */
/* U净 登录态失效: 直接弹一次窗让用户重登, 不要在每张卡每个请求里反复试探.
   U_DEAD 是防重入闸, 登录成功或主动点"去登录"时清掉. */
var U_DEAD = false;
function uSessionDead(){
  U.token = null; U.account = null; U.result = null; U.orderId = null;
  U.devices = []; U.selDev = null;
  if(U_DEAD) return;
  U_DEAD = true;
  log('U净 登录态失效, 弹一次窗提示重登', 'e');
  alertBox('U净 登录已过期',
    'U净 的登录态是限时的, 这个已经失效了.<br>重新收一次验证码就好.',
    [{ label: '去登录', cls: 'btn-b', fn: function(){
        U_DEAD = false;
        if(CUR !== 'laundry') enterApp('laundry'); else paint();
      } },
     { label: '先不管', fn: function(){ if(CUR === 'laundry') paint(); } }]);
}
async function fmLoad(){
  if(!U.token){ FM.err = '要先登录 U净'; FM.loaded = true; if(CUR==='laundry') paint(); return; }
  if(!FM.loc){ FM.err = '先取一次定位'; FM.loaded = true; if(CUR==='laundry') paint(); return; }
  if(FM.busy) return;
  FM.busy = true; FM.err = null;
  /* 参数名是 lat / lont, 不是 latitude / longitude; 端点是 stores/near.
     依据 U净 官方包 assets/washer/store.js: nearStores({lat, lont, page, size, scope, mode:"BA"}). */
  /* 官方 searchStore.js: {keyword, lat, lont, page, size, scope:2000, mode:'BA'} */
  var q = '?lat=' + FM.loc.lat + '&lont=' + FM.loc.lng + '&page=1&size=20&scope=2000&mode=BA'
        + (FM.kw ? ('&keyword=' + encodeURIComponent(FM.kw)) : '');
  var tries = [
    ['/api/v1/stores/near' + q, 'GET', null],
    ['/api/v1/stores/near?lat=' + FM.loc.lat + '&lont=' + FM.loc.lng + '&page=1&size=20', 'GET', null]
  ];
  var lastErr = null;
  for(var i=0;i<tries.length;i++){
    try{
      var j = await ucall(tries[i][1], tries[i][0], tries[i][2], true);
      if(j.code === 0){
        var d = j.data;
        var arr = Array.isArray(d) ? d
          : (d && (d.storeList || d.items || d.list || d.records || d.stores || d.devices)) || [];
        FM.stores = Array.isArray(arr) ? arr : [];
        FM.loaded = true; FM.busy = false;
        log('附近建筑: ' + FM.stores.length + ' 条 (来自 ' + tries[i][0].split('?')[0] + ')', 's');
        if(CUR==='laundry') paint();
        return;
      }
      if(j.code === 401){ uSessionDead(); FM.err = 'U净 登录态失效, 请重新登录'; break; }
      lastErr = 'code=' + j.code + ' ' + (j.message || '');
    }catch(e){ lastErr = e.message; }
  }
  FM.busy = false; FM.loaded = true;
  FM.err = lastErr || '这个坐标附近没有 U净 的洗衣房';
  log('附近查询: ' + FM.err, 'e');
  if(CUR==='laundry') paint();
}

/* 选中一个建筑, 拉它下面的全部机器 */
async function fmEnter(store){
  /* 正版链: fetchStore -> deviceTags -> program/info. 不再调 stores/{id}/devices
     (官方从不调它, 7040602 就是那个端点的业务拒绝). */
  FM.cur = store;
  FM.devs = []; FM.devsErr = null; FM.devsBusy = true;
  if(CUR==='laundry') paint();
  var sid = store.id || store.storeId;
  if(!sid){ FM.devsBusy = false; FM.devsErr = '这个建筑没有 storeId'; paint(); return; }
  if(store.deviceNum === 0){
    FM.devsBusy = false; FM.devsErr = '这家店一台设备都没有(正版也会这么提示)';
    paint(); return;
  }
  try{
    /* 1. 店信息: 拿 deviceTags 与 reservationEnabled */
    var js = await ucall('GET', '/api/v1/app/washer/store/info?storeId=' + sid, null, true);
    log('store/info: ' + String(js && js.raw || JSON.stringify(js)).slice(0, 240), 'w');
    try{ if(js && js.data && js.data.serviceSubjectId){ window.__hzSSID = js.data.serviceSubjectId; } }catch(eS){}
    if(js.code === 401){ uSessionDead(); FM.devsErr = 'U净 登录态失效'; FM.devsBusy = false; paint(); return; }
    if(js.code !== 0){
      FM.devsErr = '店信息读不到: code=' + js.code + ' ' + (js.message || '');
      FM.devsBusy = false; paint(); return;
    }
    var st = js.data || {};
    if(st.reservationEnabled === false){
      FM.devsBusy = false;
      FM.devsErr = '这家店不开放预约, 只能现场扫码(正版同样限制)';
      paint(); return;
    }
    var tags = st.deviceTags || [];
    if(!tags.length){ tags = [{deviceTypeId:null, deviceTypeName:'洗衣机'}]; }
    /* 2. 逐类型问 program/info, 取第一台有 deviceId 的 */
    for(var ti=0; ti<tags.length; ti++){
      var tgid = tags[ti].deviceTypeId;
      var u = '/api/v1/app/washer/devices/program/info?storeId=' + sid
            + (tgid ? ('&deviceTypeId=' + tgid) : '');
      var jp = await ucall('GET', u, null, true);
      log('program/info[' + ti + ']: ' + String(JSON.stringify(jp)).slice(0, 240), 'w');
      if(jp.code === 401){ uSessionDead(); FM.devsErr = 'U净 登录态失效'; break; }
      if(jp.code !== 0 || !jp.data || !jp.data.deviceId) continue;
      var d = jp.data;
      FM.devs.push({
        deviceId: d.deviceId, deviceNo: d.deviceNo, deviceTypeId: d.deviceTypeId,
        deviceTypeName: d.deviceTypeName || tags[ti].deviceTypeName, moduleType: d.moduleType,
        type: d.type, warmTip: d.warmTip, status: 1, statusName: '可预约',
        name: d.deviceNo || d.deviceId,   /* 正版渲染 deviceNo, 不是 typeName */
        createOrderEnabled: true,          /* 预约链返回即认为可约, 真实状态以 waitTime/createOrder 为准 */
        _skuConfig: d.skuConfig, _washTemp: d.isWashTemperatureEnable,
        _models: d.deviceWashModels || null
      });
    }
    if(!FM.devs.length){
      /* program/info 没给机器(空闲为空)时, 走官方预约机器链 fetchDeviceByStoreId:
         GET devices/reserve?storeId= (正版预约页取数端点, 返回什么渲染什么). */
      var jr = await ucall('GET', '/api/v1/devices/reserve?storeId=' + sid, null, true);
      log('devices/reserve: ' + String(JSON.stringify(jr)).slice(0, 240), 'w');
      if(jr.code === 401){ uSessionDead(); FM.devsErr = 'U净 登录态失效'; FM.devsBusy = false; paint(); return; }
      if(jr.code === 0 && jr.data){
        /* 官方预约模式: devices/reserve 返回按类型汇总的 device{free,total,moduleType,
           tips,waitTime} + deviceWashModel[] -- 没有 deviceId!
           这就是"先选类型和程序下单付款, 付款后服务端分配机器并告知几号". */
        var arrR = Array.isArray(jr.data) ? jr.data : (jr.data.devices || jr.data.list || []);
        try{
          var d0 = arrR[0];
          if(d0 && d0.deviceWashModel && d0.deviceWashModel[0]){
            log('reserve model keys: ' + Object.keys(d0.deviceWashModel[0]).join(',') + ' | ' + JSON.stringify(d0.deviceWashModel[0]).slice(0,200), 'w');
          }
        }catch(eL){}
        (Array.isArray(arrR) ? arrR : []).forEach(function(d){
          var dev = d.device || d;
          var free = Number(dev.free != null ? dev.free : (dev.total - dev.usingCount));
          var total = Number(dev.total || 0);
          if(!total && !dev.deviceTypeId) return;
          FM.devs.push({
            deviceId: '',                 /* 预约模式: 服务端付款后分配 */
            deviceNo: '',
            reserveMode: true,
            deviceTypeId: dev.deviceTypeId, deviceTypeName: dev.deviceTypeName || '',
            moduleType: dev.moduleType, type: dev.type, warmTip: dev.tips || dev.warmTip || '',
            waitTime: dev.waitTime || 0,
            status: free > 0 ? 1 : 2,
            statusName: free > 0 ? (free + '/' + total + ' 台可约') : '无空闲',
            name: (dev.deviceTypeName || '洗衣机') + ' ' + free + '/' + total + ' 台',
            createOrderEnabled: free > 0,
            _models: d.deviceWashModel || d.deviceWashModels || null
          });
        });
      }
    }
    if(FM.devs.length){
      log('建筑内机器: ' + FM.devs.length + ' 台', 's');
    }else{
      FM.devsErr = FM.devsErr || ('这台店现在没有可预约的机器'
        + (st.deviceNum ? (' (店内有 ' + st.deviceNum + ' 台, 可能都被占用)') : ''));
    }
  }catch(e){ FM.devsErr = e.message; }
  FM.devsBusy = false;
  paint();
}

function fmBack(){
  FM.cur = null; FM.devs = []; FM.devsErr = null; FM.kw = null;
  paint();
}

/* 直接选中某台机器, 回洗衣页下单 */
function fmPickDev(d){
  var did = d.id || d.deviceId;
  if(d.reserveMode){
    /* 预约模式: 不需要具体机器, 直接进入该类型的程序与下单流程, 付款后服务端分配机器. */
    U.result = {
      deviceId: '', deviceNo: '', reserveMode: true,
      deviceTypeId: d.deviceTypeId, deviceTypeName: d.deviceTypeName,
      storeId: FM.cur ? (FM.cur.id || FM.cur.storeId) : '',
      storeName: FM.cur ? (FM.cur.name || FM.cur.storeName) : '',
      createOrderEnabled: true,
      warmTip: d.warmTip || '',
      _models: d._models || null
    };
    U.result._fromFind = true;   /* 楼内预约选过, 主卡不再画"选择机器" */
    U.selDev = null;
    U.devices = FM.devs.slice(0);
    U_PROG.loaded = false; U_PROG.models = []; U_PROG.temps = []; U_PROG.err = null;
    U_PROG.storeId = U.result.storeId;
    U_PROG.busy = true;
    /* 预约模式程序表从 program/info 拉(storeId+deviceTypeId 定位, 不需要 deviceId) --
       devices/reserve 附带的 deviceWashModel 是简版, 键名不齐(用户截图 undefined). */
    (async function(){
      try{
        var u2 = '/api/v1/app/washer/devices/program/info?storeId=' + U.result.storeId
               + (d.deviceTypeId ? ('&deviceTypeId=' + d.deviceTypeId) : '');
        var jp = await ucall('GET', u2, null, true);
        /* 诊断: program/info 顶层与 data 里所有跟机器身份有关的键 */
        (function(){
          var dd0 = (jp && jp.data) || {};
          var ks = ['deviceId','deviceNo','deviceCode','macAddress','moduleType','type',
                    'deviceTypeId','deviceTypeName','storeId','storeName'];
          var o1 = {};
          for(var zi=0; zi<ks.length; zi++){ if(dd0[ks[zi]] !== undefined) o1[ks[zi]] = dd0[ks[zi]]; }
          log('reserve program/info code=' + (jp && jp.code) + ' 机器字段=' + JSON.stringify(o1), 'w');
          if(dd0.device) log('reserve data.device=' + JSON.stringify(dd0.device).slice(0,200), 'w');
          if(dd0.devices) log('reserve data.devices n=' + dd0.devices.length
            + ' first=' + JSON.stringify(dd0.devices[0]||null).slice(0,200), 'w');
        })();
        /* 官方字段: program/info 与 devices/reserve 的程序数组键都是
           deviceWashModel(单数); reserve 简版项键名 = id/workModel/basePrice/
           description/time/isPromotion. 统一归一. */
        var wmArr = (jp.code === 0 && jp.data)
          ? (jp.data.deviceWashModel || jp.data.deviceWashModels) : null;
        /* 正版 reservation.js 的 device 正是从这个响应取的:
           {deviceId, deviceNo, deviceTypeId, deviceTypeName, moduleType, type, warmTip, showMore}.
           原来只取 deviceWashModel, deviceId 留空 -> orders/create 报 1603 未找到该设备. */
        var pd = (jp.code === 0 && jp.data) ? jp.data : {};
        if(pd.deviceId){
          U.result.deviceId = pd.deviceId;
          U.result.reserveMode = false;
          U.selDev = pd.deviceId;
          log('预约拿到机器 ' + (pd.deviceNo || '') + ' (' + pd.deviceId + ')', 's');
        }
        if(pd.deviceNo){ U.result.deviceNo = pd.deviceNo; U.result.devNo = pd.deviceNo; }
        if(pd.deviceTypeId) U.result.deviceTypeId = pd.deviceTypeId;
        if(pd.deviceTypeName) U.result.deviceTypeName = pd.deviceTypeName;
        if(pd.moduleType != null) U.result.moduleType = pd.moduleType;
        if(pd.type != null) U.result.type = pd.type;
        if(pd.warmTip) U.result.warmTip = pd.warmTip;
        if(wmArr && wmArr.length){
          var ms = wmArr.map(function(w){ return Object.assign({ isDefault: false }, w); });
          U_PROG.models = ms;
          U_PROG.loaded = true;
          U_SEL.mode = ms[0].workModelId;
          U_SEL.det = 0; U_SEL.dis = 0;
          U_PROG.temps = [];
          log('预约程序 ' + ms.length + ' 种 (program/info 完整版)', 's');
        }else if(d._models && d._models.length){
          U_PROG.models = d._models.map(function(w){
            return {
              workModelId: w.workModelId || w.id,
              workModelName: w.workModel || w.workModelName || w.name || w.description,
              basePrice: w.basePrice || 0,
              time: w.time || w.washTime || 0,
              description: w.description || '',
              isDefault: false
            };
          });
          U_PROG.loaded = true;
          U_SEL.mode = U_PROG.models[0].workModelId;
          U_SEL.det = 0; U_SEL.dis = 0;
          U_PROG.temps = [];
          log('预约程序 ' + U_PROG.models.length + ' 种 (devices/reserve 简版兜底)', 'w');
        }else{
          U_PROG.err = '这个类型没有可预约的程序';
        }
      }catch(eP){ U_PROG.err = eP.message; }
      U_PROG.busy = false;
      if(CUR === 'laundry') paint();
    })();
    log('预约模式: ' + (d.deviceTypeName || '') + ' ' + (d.statusName || ''), 's');
    toast('预约 ' + (d.deviceTypeName || '') + ', 选程序下单');
    popPage();
    paint();
    return;
  }
  U.rawQr = did; /* 没有扫码串时用 deviceId 兜底, scanWasherCode 也认 */
  if(!did){ alertBox('这台没有设备号', '接口没返回 deviceId, 只能扫码.'); return; }
  U.result = {
    deviceId: did,
    deviceNo: d.deviceNo || '',
    devNo: d.deviceNo || '',
    deviceName: d.name || d.deviceName || d.deviceCode,
    deviceTypeId: d.deviceTypeId || 2,
    deviceTypeName: d.deviceTypeName,
    storeId: FM.cur ? (FM.cur.id || FM.cur.storeId) : d.storeId,
    storeName: FM.cur ? (FM.cur.name || FM.cur.storeName) : d.storeName,
    createOrderEnabled: d.createOrderEnabled !== false
  };
  U.result._fromFind = true;     /* 楼内选过, 主卡不再重复列机器 */
  U.selDev = did;
  U.devices = FM.devs.slice(0);
  U_PROG.loaded = false; U_PROG.models = []; U_PROG.temps = []; U_PROG.err = null;
  log('从建筑列表选中机器 ' + did + ' @ ' + (U.result.storeName||''), 's');
  uLoadProgram();
  toast('已选 ' + (U.result.deviceName || did));
  popPage();
  paint();
}

function fmDevFree(d){
  if(d.createOrderEnabled === false) return false;
  if(d.status !== undefined && d.status !== null){
    var s = String(d.status);
    if(s === '2' || s === '3') return false;
  }
  return true; /* 预约链(program/info)返回即默认可约 */
}
function fmDistSrc(s){
  /* 服务端 distance 疑似门店注册坐标算的, 实测偏差大; 门店响应里若有
     latitude/longitude 就用 Haversine 本地重算, 更接近真实步行距离. */
  if(s && s.latitude != null && s.longitude != null
     && FM.loc && FM.loc.lat && FM.loc.lng){
    return haversineM(Number(FM.loc.lat), Number(FM.loc.lng),
                      Number(s.latitude), Number(s.longitude));
  }
  return s && s.distance;
}

function haversineM(lat1, lnt1, lat2, lnt2){
  var R = 6371000, r = Math.PI/180;
  var dLat = (lat2-lat1)*r, dLnt = (lnt2-lnt1)*r;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2)
        + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLnt/2)*Math.sin(dLnt/2);
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmDist(v){
  /* 服务端 distance 单位是 km(官方 store.js 渲染 info.distance+"km").
     兼容: 值 < 10 视为 km 换算成米; >= 10 视为已经传成米(老版本兼容). */
  if(v === undefined || v === null || v === '') return '';
  var n = Number(v);
  if(isNaN(n)) return String(v);
  if(n < 10) n = n * 1000;
  return n < 1000 ? (Math.round(n) + ' m') : ((n/1000).toFixed(1) + ' km');
}

var AL_KEY = 'hz_alarms_v6';
var AL = { list:[] };

function alLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(AL_KEY) || '[]');
    if(Array.isArray(o)) AL.list = o.filter(function(a){ return a && a.at; });
  }catch(e){}
}
function alSave(){
  var js = JSON.stringify(AL.list.slice(0, 12));
  try{ localStorage.setItem(AL_KEY, js); }catch(e){}
  mirPut(AL_KEY, js);
  dumpSoon();
}
function alAdd(entry){
  AL.list = AL.list.filter(function(a){ return a.tag !== entry.tag; });
  AL.list.unshift(entry);
  if(AL.list.length > 12) AL.list.length = 12;
  alSave();
}
function alDel(tag){
  AL.list = AL.list.filter(function(a){ return a.tag !== tag; });
  alSave();
}

/* ---------------- 账单时间 -> 闹钟时刻(需求1) ----------------

   为什么以 end 为主: 账单里 washEndTime/endTime/finishTime 是服务端算好的绝对完成时刻,
   直接拿来设闹钟最准. remain 只是"还剩多少", 页面每 5 秒轮询一次, 每次拿 remain 重算
   都会把闹钟往后推, 越推越不准, 这就是过去"设了但响不准"的一个来源.

   单位: 官方 orderDetail 的 count-down 组件 hour = count/3600, 所以 remainTime 是秒.
   但为防接口改动, 这一层仍做单位判定, 判据改成"两次轮询的下降速率", 见 remainUnit().
   绝不能按数值大小猜 -- 短单(洗鞋 5-8 分钟)的秒数很小, 会被误判成分钟.
   ============================================================ */
var AL_AUTO_KEY = 'hz_alarms_auto_v1';
var AL_AUTO = {};

function alAutoLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(AL_AUTO_KEY) || '{}');
    if(o && typeof o === 'object') AL_AUTO = o;
  }catch(e){ AL_AUTO = {}; }
}
function alAutoSave(){
  try{ localStorage.setItem(AL_AUTO_KEY, JSON.stringify(AL_AUTO)); }catch(e){}
}

/* remain 的单位判定.

   官方 orderDetail 的 count-down 组件把 remainTime 直接喂给 count,
   内部 hour = count/3600, 所以服务端给的是**秒**. 但过去这里按"数值 >600 才当秒"
   猜单位, 结果 10 分钟以内的短单(洗鞋 5-8 分钟)全被当成分钟:
   remainTime=300(真实 5 分钟) 会被算成 300 分钟, 闹钟晚响将近 5 小时;
   remainTime=480 更会被后面 mm<480 的判据挡掉, 干脆一条都不设.

   不靠猜数值大小, 靠**两次轮询之间的下降速率**判定:
   5 秒内掉了约 5 -> 秒; 掉了约 0.08 -> 分钟. 第一次没有历史时按秒(有官方代码为证). */
/* remainTime 是秒. 依据: 官方 orderDetail.js 的 count-down 组件
   data: { hour: this.count/3600, min: ..., sec: ... }, 调用处 count: Number(info.remainTime)||0.
   所以这里只做一次除法, 不再按数值大小猜单位. */

function remainMinutes(raw, oid){
  if(raw === null || raw === undefined || raw === '') return null;
  if(typeof raw === 'number'){
    return raw / 60;   /* 秒 -> 分 */
  }
  var s = String(raw).trim();
  var m = s.match(/(\d+)\s*分/);
  if(m) return Number(m[1]);
  m = s.match(/(\d+)\s*秒/);
  if(m) return Math.ceil(Number(m[1]) / 60);
  m = s.match(/^(\d+):(\d+)$/);
  if(m) return Number(m[1]) + Number(m[2]) / 60;
  m = s.match(/^(\d+)$/);
  if(m){
    return Number(m[1]) / 60;   /* 秒 -> 分 */
  }
  return null;
}

/* 账单 -> 绝对完成时刻(ms). 优先绝对 end, 拿不到才用 remain 相对推算 */
function alEndOf(f){
  if(!f) return null;
  if(f.end){
    var t = uFmtTime(f.end);
    var m = String(t || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
    if(m){
      var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]),
                       Number(m[4]), Number(m[5]), 0, 0);
      var ms = d.getTime();
      /* washEndTime 是服务器坐标系的绝对时刻, 先减 skew 换到设备坐标系再登记.
         不减的话手机时钟一偏, 闹钟就额外偏同样的量. */
      if(!isNaN(ms)){
        var devMs = ms - SRV_SKEW;
        /* 明显不合理的过去时间(接口给了已完成单的旧 end)不用 */
        if(devMs > Date.now() - 60000 && devMs < Date.now() + 8 * 3600 * 1000) return devMs;
      }
    }
  }
  var mm = remainMinutes(f.remain, f.orderId || U.orderId);
  /* 上限放到 12 小时. 老的 480(8 小时)是为了挡住"秒被当成分钟"的脏值 --
     那种脏值动辄几百上千分钟. 单位判定修好之后, 这个上限只剩"别设到明天"的意义. */
  /* remain 是"还剩多少秒"这个纯时长, 与任何时钟的读数无关 -- 直接加在本机时刻上.
     这一路不受手机时钟准不准影响, 是主路径. */
  if(mm != null && mm > 0 && mm < 720) return Date.now() + Math.round(mm) * 60000;
  return null;
}

/* 该单是否还需要闹钟: 只有"正在跑/自洁/投放/已支付待启动"才需要 */
function alNeedFor(f){
  if(!f) return false;
  var n = Number(f.stNum);
  if(n === 30 || n === 40 || n === 24 || n === 21 || n === 22 || n === 35) return true;
  if(n === 10) return false;          /* 待支付: 不设完成闹钟, 免得没付钱就响 */
  if(n >= 50) return false;           /* 已终态 */
  return false;
}

/* 订单类型: 4 = 洗鞋, 其他按洗衣. 用于区分标题(需求1 明确要求按洗衣/洗鞋分别创建) */
function alKindOf(f){
  return Number(f && f.deviceTypeId) === 4 ? 'shoe' : 'wash';
}

/* 自动设置: 一次账单同步里调用. 同一单同一时刻只设一次, 不重复登记. */
function alAutoSync(f){
  if(!f) return;
  if(!alNeedFor(f)) return;
  var oid = f.orderId || U.orderId;
  if(!oid) return;
  var at = alEndOf(f);
  if(!at) return;
  var kind = alKindOf(f);
  var tag = kind + '_' + oid;
  /* 时刻变化小于 60 秒视为同一次, 不重设(避免轮询每 5 秒重置闹钟) */
  var old = AL_AUTO[String(oid)];
  if(old && Math.abs(Number(old.at) - at) < 60000) return;
  var isShoe = kind === 'shoe';
  var title = isShoe ? '洗鞋完成提醒' : '洗衣完成提醒';
  var text = (isShoe ? '鞋机 ' : '洗衣机 ') + (f.dev || '') + ' 这单快结束了';
  AL_AUTO[String(oid)] = { at: at, kind: kind, sent: 0 };
  alAutoSave();
  log('按账单时间自动设闹钟: ' + title + ' @ ' + new Date(at).toLocaleString(), 's');
  alSetBoth(at, title, text, tag, true);
}

/* 订单进入"没意义"的终态(取消/启动失败/超时/故障)时, 撤掉还没响的自动闹钟.
   原来只有用户手动删提醒才会 cancelAlarm, 订单被取消后那条闹钟会一直挂着,
   到点照样响 -- 用户看到的就是"机器没洗却提醒我洗完了".

   注意 50(订单完成) 不撤: 那正是这条闹钟要报的事, 撤了就白设了. */
function alAutoDrop(f, why){
  if(!f) return;
  var oid = f.orderId || U.orderId;
  if(!oid) return;
  var rec = AL_AUTO[String(oid)];
  if(!rec) return;
  delete AL_AUTO[String(oid)];
  alAutoSave();
  var tag = (rec.kind || 'wash') + '_' + oid;
  alDel(tag);
  if(HASNATIVE && window.HzNative.cancelAlarm){
    try{ window.HzNative.cancelAlarm('ac' + (++cbSeq), tag); }catch(e){}
  }
  log('订单进入终态(' + (why || '已结束') + '), 撤掉自动闹钟 ' + tag, 's');
}

/* 把"洗衣剩余 N 分钟"换算成触发时刻; 拿不到剩余时间就给一个可改的默认值 */
/* 站内提醒: 到点弹网页通知 + 页面 toast. 页面关了就不管, 但会如实写进日志. */
var WEBAL = {};
function webRemind(at, title, text){
  var ms = at - Date.now();
  if(ms <= 0) return;
  if(ms > 2147483000) ms = 2147483000;
  var key = 'w' + at;
  if(WEBAL[key]) clearTimeout(WEBAL[key]);
  WEBAL[key] = setTimeout(function(){
    delete WEBAL[key];
    webNotify(title, text);
    toast(title + ': ' + text);
    log('站内提醒到点: ' + title, 's');
    var np = ('Notification' in window) ? Notification.permission : 'none';
    if(np !== 'granted') log('只有页面内提示, 想让系统也弹就得给通知权限', 'w');
  }, ms);
  if('Notification' in window && Notification.permission === 'default') notifyAsk(function(){});
}

/* 原生闹钟界面在锁屏/前台被点掉时页面是冻结的, 没法直接回调 JS.
   原生存一条 pending 事件(off:<tag> / snooze:<tag>), 页面每 2 秒取一次. */
var AL_POLL_T = 0;
function alPollEvent(){
  if(!HASNATIVE || !window.HzNative.alarmEvent) return;
  var ev = '';
  try{ ev = String(window.HzNative.alarmEvent() || ''); }catch(e){ return; }
  if(!ev) return;
  var i = ev.indexOf(':');
  var kind = i < 0 ? ev : ev.slice(0, i);
  var tag = i < 0 ? '' : ev.slice(i + 1);
  if(kind === 'off'){
    if(tag) alDel(tag);
    log('闹钟已关闭' + (tag ? (': ' + tag) : ''), 's');
    if(PAGE_STACK.length) paint();
  }else if(kind === 'snooze'){
    log('闹钟已推迟 5 分钟' + (tag ? (': ' + tag) : ''), 's');
    if(tag){
      AL.list.forEach(function(a){ if(a.tag === tag) a.at = Date.now() + 5 * 60000; });
      alSave();
    }
    toast('5 分钟后再响');
    if(PAGE_STACK.length) paint();
  }
}
function alPollStart(){
  alPollStop();
  if(!HASNATIVE || !window.HzNative.alarmEvent) return;
  AL_POLL_T = setInterval(alPollEvent, 2000);
}
function alPollStop(){
  if(AL_POLL_T){ clearInterval(AL_POLL_T); AL_POLL_T = 0; }
}

function guessRemainMin(){
  var f = U.lastOrder || {};
  var raw = f.remain;
  if(raw === null || raw === undefined || raw === '') return null;
  if(typeof raw === 'number') return raw;
  var s = String(raw);
  var m = s.match(/(\d+)\s*分/);
  if(m) return Number(m[1]);
  m = s.match(/^(\d+)$/);
  if(m) return Number(m[1]);
  m = s.match(/(\d+):(\d+)/);
  if(m) return Number(m[1]) * 60 + Number(m[2]);
  return null;
}

function alSetReal(how){
  var min = Number(($('alMin') && $('alMin').value) || 0);
  if(!min || min <= 0 || min > 600){
    alertBox('分钟数不对', '填 1 到 600 之间的整数分钟.');
    return;
  }
  var at = Date.now() + min * 60000;
  var isShoe = Number((U.lastOrder && U.lastOrder.deviceTypeId) || 0) === 4;
  var tag = (isShoe ? 'shoe_' : 'wash_') + (U.orderId || 'x');
  var title = isShoe ? '洗鞋完成提醒' : '洗衣完成提醒';
  var text = '还有 ' + min + ' 分钟';
  if(how === 'clock'){ alSetClockOnly(at, title, text, tag); return; }
  if(how === 'app'){ alSetAppOnly(at, title, text, tag); return; }
  alSetBoth(at, title, text, tag, false);
}

/*
 * 同时走两条通道设闹钟(需求1: 系统闹钟优先, 系统闹钟不受后台清理影响).
 *
 *   通道一 系统时钟 App: HzNative.systemAlarm(hh, mm, title) -> SET_ALARM.
 *          闹钟由厂商时钟 App 持有, 本应用被杀也照响, 这是主通道.
 *   通道二 本应用 AlarmManager: HzNative.setAlarm(at, ...) -> setAlarmClock.
 *          作为兜底, 万一这台机器的时钟 App 不认静默登记, 还有一层.
 *
 * 两条都尝试, 最后把"实际成功的是哪几条"记到 AL 列表里, 界面上照实显示,
 * 不谎报成功. 系统时钟通道只吃时分, 所以跨天时按"最近一次该时分"理解,
 * 与系统时钟自身的语义一致.
 */
function alSetBoth(at, title, text, tag, auto){
  if(!HASNATIVE){
    alAdd({ tag:tag, at:at, title:title, mode:'web' });
    webRemind(at, title, text);
    log('站内提醒已设: ' + new Date(at).toLocaleString(), 's');
    toast(auto ? '已设站内提醒' : '提醒已设');
    if(auto && PAGE_STACK.length) paint();
    return;
  }
  var seq = ++cbSeq;
  var d = new Date(at);
  var st = { clock:0, app:0, clockErr:'', appErr:'' };   /* 0 未回, 1 成功, 2 失败 */
  var kClock = 'alc' + seq;
  var kApp = 'ala' + seq;

  function done(){
    if(st.clock === 0 || st.app === 0) return;
    var modes = [];
    if(st.clock === 1) modes.push('clock');
    if(st.app === 1) modes.push('app');
    if(!modes.length){
      alertBox('闹钟没设上',
        '系统时钟: ' + esc(st.clockErr || '没响应') + '<br>'
        + '应用内闹钟: ' + esc(st.appErr || '没响应')
        + '<br><br>如果提示缺精确闹钟权限, 点下面按钮授权后重试.');
      if(auto) log('自动设闹钟失败: ' + st.clockErr + ' / ' + st.appErr, 'e');
      return;
    }
    alAdd({ tag:tag, at:at, title:title, mode:modes.join('+'), auto:!!auto });
    log('闹钟已设(' + modes.join('+') + '): ' + new Date(at).toLocaleString(), 's');
    if(auto) toast('已自动设' + title);
    else toast(st.clock === 1 ? '已加到系统时钟' : '闹钟已设(应用内)');
    if(PAGE_STACK.length) paint();
  }

  /* 通道一: 系统时钟 */
  window.__hzCb[kClock] = function(r){
    delete window.__hzCb[kClock];
    if(r && r.ok) st.clock = 1;
    else { st.clock = 2; st.clockErr = (r && r.err) || '没有可用的时钟 App'; }
    done();
  };
  /* 系统时钟通道(SET_ALARM)只能到"时:分", 秒被截掉. 直接 getMinutes() 最多早响 59 秒 --
     洗衣机还在转就响了, 用户体感就是"不准". 秒数过半就进位到下一分钟: 宁可晚响, 不要早响. */
  var dc = new Date(at);
  if(dc.getSeconds() >= 30) dc.setMinutes(dc.getMinutes() + 1);
  try{ window.HzNative.systemAlarm(kClock, dc.getHours(), dc.getMinutes(), title); }
  catch(e){ st.clock = 2; st.clockErr = String(e && e.message || e); done(); }

  /* 通道二: 应用内 AlarmManager(精确闹钟权限缺失时原生会回 needExactAlarm) */
  window.__hzCb[kApp] = function(r){
    delete window.__hzCb[kApp];
    if(r && r.ok) st.app = 1;
    else if(r && r.needExactAlarm){
      st.app = 2; st.appErr = '缺精确闹钟权限';
      alertBox('还差一个权限', 'Android 12 起, 设精确闹钟要单独允许.<br>点下面的按钮打开, 回来再点一次.',
        [{ label:'去授权', cls:'btn-b', fn:function(){
            try{ window.HzNative.exactAlarmPerm('eap' + (++cbSeq)); }catch(e){}
          } }, { label:'取消' }]);
    }else{ st.app = 2; st.appErr = (r && r.err) || '登记失败'; }
    done();
  };
  try{ window.HzNative.setAlarm(kApp, at, title, text, tag); }
  catch(e){ st.app = 2; st.appErr = String(e && e.message || e); done(); }
}

/* 只走系统时钟一条(用户手动选择时用). 结果照实报, 不回落. */
function alSetClockOnly(at, title, text, tag){
  if(!HASNATIVE){
    toast('网页版没有系统时钟通道');
    return;
  }
  var k = 'alc' + (++cbSeq);
  var d = new Date(at);
  /* 同 alSetBoth: 秒过半进位, 避免早响 */
  if(d.getSeconds() >= 30) d.setMinutes(d.getMinutes() + 1);
  window.__hzCb[k] = function(r){
    delete window.__hzCb[k];
    if(r && r.ok){
      alAdd({ tag:tag, at:at, title:title, mode:'clock', auto:false });
      toast(r.silent ? ('已静默加入' + (r.label || '系统时钟')) : ('已打开' + (r.label || '系统时钟') + ', 请在界面上确认'));
      log('系统时钟已登记(' + (r.label || r.pkg || '?') + ', 静默=' + !!r.silent + '): ' + new Date(at).toLocaleString(), 's');
      if(PAGE_STACK.length) paint();
      return;
    }
    alertBox('系统时钟没设上',
      (r && r.none)
        ? '这台机器上没有能接系统闹钟的时钟 App. 可以去系统设置里确认"时钟"是否被停用, 或改走应用内闹钟.'
        : ('原因: ' + esc((r && r.err) || '没响应') + '<br><br>可以用下面的按钮改走应用内闹钟.'),
      [{ label:'改走应用内', cls:'btn-b', fn:function(){ alSetAppOnly(at, title, text, tag); } },
       { label:'取消' }]);
  };
  try{ window.HzNative.systemAlarm(k, d.getHours(), d.getMinutes(), title); }
  catch(e){
    alertBox('系统时钟没设上', '调用失败: ' + esc(String(e && e.message || e)));
  }
}

/* 只走应用内 AlarmManager 一条. */
function alSetAppOnly(at, title, text, tag){
  if(!HASNATIVE){
    alAdd({ tag:tag, at:at, title:title, mode:'web' });
    webRemind(at, title, text);
    toast('已设站内提醒');
    if(PAGE_STACK.length) paint();
    return;
  }
  var k = 'ala' + (++cbSeq);
  window.__hzCb[k] = function(r){
    delete window.__hzCb[k];
    if(r && r.ok){
      alAdd({ tag:tag, at:at, title:title, mode:'app', auto:false });
      toast('已设应用内闹钟');
      if(PAGE_STACK.length) paint();
      return;
    }
    if(r && r.needExactAlarm){
      alertBox('还差一个权限', 'Android 12 起, 设精确闹钟要单独允许.<br>点下面的按钮打开, 回来再点一次.',
        [{ label:'去授权', cls:'btn-b', fn:function(){
            try{ window.HzNative.exactAlarmPerm('eap' + (++cbSeq)); }catch(e){}
          } }, { label:'取消' }]);
      return;
    }
    alertBox('应用内闹钟没设上', '原因: ' + esc((r && r.err) || '没响应'));
  };
  try{ window.HzNative.setAlarm(k, at, title, text, tag); }
  catch(e){
    alertBox('应用内闹钟没设上', '调用失败: ' + esc(String(e && e.message || e)));
  }
}

/* 兼容老调用点: 默认单号 tag, 两条通道一起走 */
function alSetAt(at, title, text){
  var tag = 'wash_' + (U.orderId || 'x');
  alSetBoth(at, title, text, tag, false);
}


/* ============================================================
   6.9 洗衣页 (v6 重构)
   结构: 账号 -> 当前订单(实时) -> 找附近机器 -> 扫码 -> 选机器 -> 下单 -> 历史订单

   ============================================================ */
function pageLaundry(host){

    h += '<div class="sub">U净 账号体系独立, 需用你自己的手机号收码.</div>';
  }
  h += '</div>';


  /* ===== 2. 扫码: 账号下面第一个, 最主要的操作入口 ===== */
  var U_HAS_ORD0 = (UO.items || []).length > 0 || !!U.orderId;
  h += '<div class="card"><h2>扫码洗衣 '
    + badge(U_HAS_ORD0 ? '订单处理中'
            : (U.result ? (U.result.createOrderEnabled?'空闲可用':'使用中') : '未读取'),
            U_HAS_ORD0 ? 'warn'
            : (U.result ? (U.result.createOrderEnabled?'on':'warn') : '')) + '</h2>';
  h += '<button class="bigscan" id="uScanPick">'
    + '<span class="bigscan-i">&#9635;</span>'
    + '<span class="bigscan-t">扫码 / 相册</span></button>';
  h += '<div class="row" style="margin-top:8px">'
    + '<input id="uQr" placeholder="也可以直接贴设备号"'
    + (U.result ? ' value="'+esc(U.result.deviceId||'')+'"' : '') + '>'
    + '<button class="btn-b" id="uResolve">读取</button></div>';
  h += '<div class="sub">设备号不限格式, 贴进去原样送到服务器去认.</div>';
  /* 设备信息块只在"选机器/扫码"阶段短暂存在. 一旦有活跃订单(未支付到运行中),
     这块必须消失 -- 否则订单结束后会残留上一台的"机器名/设备号/机型/状态".
     U_HAS_ORD 由 UO.items 或 U.orderId 决定, 渲染时实时算. */
  var U_HAS_ORD = (UO.items || []).length > 0 || !!U.orderId;
  if(U.result && !U_HAS_ORD){
    h += kv('机器名', U.result.deviceName || U.result.name || '-');
    h += kv('设备号', U.result.deviceId || '-');
    h += kv('机型', U.result.deviceTypeName || (Number(U.result.deviceTypeId)===10?'烘干机':'滚筒'));
    h += kv('店铺', U.result.storeName || (U.result.store && U.result.store.name) || '-');
    h += kv('状态', U.result.createOrderEnabled?'空闲可用':'正在使用',
            U.result.createOrderEnabled?'ok':'bad');
  }
  h += '</div>';

  /* ===== 3. 附近机器: 紧贴扫码, 不扫码也能用 ===== */
  h += '<div class="card"><h2>附近的洗衣机 '
    + badge(FM.cur ? '已进建筑' : (FM.busy ? '查询中'
            : (FM.stores.length ? (FM.stores.length + ' 个建筑') : (FM.loc ? '待查询' : '未定位'))),
            FM.cur ? 'on' : (FM.stores.length ? 'on' : (FM.busy ? 'warn' : ''))) + '</h2>';
  if(FM.cur){
    var cn = FM.cur.name || FM.cur.storeName || '当前建筑';
    var cf = FM.devs.filter(fmDevFree).length;
    h += '<div class="sub">当前: <b>' + esc(cn) + '</b> / '
      + (FM.devsBusy ? '读取机器中' : (cf + ' 台空闲')) + '</div>';
    h += '<div class="row" style="margin-top:9px">'
      + '<button class="btn-b btn-f" id="uOpenFind">预约机器</button></div>';
  }else{
    h += '<div class="sub">' + (FM.loc
      ? ('已定位 ' + FM.loc.lat.toFixed(4) + ', ' + FM.loc.lng.toFixed(4)
         + (FM.stores.length ? (' / 附近 ' + FM.stores.length + ' 栋楼') : ' / 正在查附近建筑'))
      : (FM.locErr ? ('定位失败: ' + FM.locErr) : '进页面会自动定位一次')) + '</div>';
    h += '<div class="row" style="margin-top:9px">'
      + '<button class="btn-p btn-f" id="uOpenFind">'
      + (FM.loc ? '预约机器(附近)' : '定位并预约机器') + '</button></div>';
  }
  h += '<div class="sub">自动定位 -> 最近的建筑 -> 那栋楼里的机器, 选空闲的直接下单.</div>';
  h += '</div>';

  /* ===== 4. 当前订单(双卡共存: 洗衣一张 + 洗鞋一张, 互不顶走) ===== */
  var cards = [];
  /* 事实驱动: 从订单列表(running+history 合并)取所有未完结单, 每单一卡.
     不再依赖 U.curOrd 内存态 -- 服务端有什么就显示什么. */
  /* 正版 refreshBtn 覆盖 [10,20,21,22,24,29,30,35,40,60,61];
     22 自洁启动中 / 29 退单保护 / 60 61 故障中 原来被漏掉, 这些单不建卡. */
  var ACT = {10:'已预约', 20:'已支付', 21:'启动中', 22:'自洁启动中', 24:'正在投放洗衣液',
             29:'退单保护', 30:'自洁中', 35:'自洁完成', 40:'运行中', 60:'故障中', 61:'故障中'};
  (UO.items || []).forEach(function(o){
    var oidD = String(o.orderId || o.id);
    var detD = UO.det[oidD];
    var st = Number(o.status);
    if(detD && Number(detD.status)) st = Number(detD.status);
    /* 已过期删卡的单: 服务端还报 10 就不再显示(等它真翻成 51/53);
       服务端已经离开 10 就解除标记, 让历史/新状态正常走 */
    if(UO.expired[oidD]){
      if(st === 10) return;
      delete UO.expired[oidD];
    }
    if(ACT[st] !== undefined){
      var fm = uFmt(detD || o);
      /* 类型: 列表项缺 deviceTypeId 时用 U.curOrd 恢复过的 detail 补 */
      var oid = oidD;
      if(U.curOrd){
        if(U.curOrd.shoe && String(U.curOrd.shoe.orderId) === String(oid) && U.curOrd.shoe.lastOrder){
          fm.deviceTypeId = U.curOrd.shoe.lastOrder.deviceTypeId;
        }else if(U.curOrd.wash && String(U.curOrd.wash.orderId) === String(oid) && U.curOrd.wash.lastOrder){
          fm.deviceTypeId = U.curOrd.wash.lastOrder.deviceTypeId;
        }
      }
      fm.st = ACT[st];
      fm.stNum = st;
      var isShoe = (Number(fm.deviceTypeId) === 4);
      cards.push({
        title: isShoe ? '当前洗鞋订单' : '当前洗衣订单',
        LO: fm,
        oid: oid
      });
    }
  });
  /* 兜底卡只在"本轮一次都还没拉到订单列表"时用. 拉到了就以服务端事实为准:
     51/53/50 这类终态单绝不能被内存快照复活成"已预约"(那会让用户看到假倒计时,
     点取消又因为服务端是终态而被拦, 表现为"取消没反应"). */
  if(!cards.length && U.lastOrder && !UO.loaded && !(UO.items || []).length){
    var fbC = {};
    for(var fbk in U.lastOrder){ if(Object.prototype.hasOwnProperty.call(U.lastOrder, fbk)) fbC[fbk] = U.lastOrder[fbk]; }
    fbC.st = '读取中'; fbC.stNum = NaN; fbC.payLeft = null; fbC.remain = null;
    cards.push({ title:'当前订单', LO:fbC, oid:U.orderId });
  }
  if(!signed){
    h += '<div class="card"><h2>当前订单</h2><div class="empty">先登录 U净</div></div>';
  }else if(!cards.length){
    h += '<div class="card"><h2>当前订单</h2><div class="empty">还没有下单. 从上面选一栋楼的空机器, 或者扫码.</div>';
    h += '<div class="sub">U净 没有钱包也不预充值: 下单时按机型与水温室温实时计价, 下单即扣款.</div></div>';
  }
  for(var ci2 = 0; ci2 < cards.length; ci2++){
    h += '<div class="card"><h2>' + esc(cards[ci2].title) + ' '
      + badge(cards[ci2].LO.st || '进行中',
              /完成|结束|finish|done|end/i.test(String(cards[ci2].LO.st||'')) ? 'ok' : 'warn')
      + '</h2>';
    var LO = cards[ci2].LO;
    var doneO = /完成|结束|finish|done|end/i.test(String(LO.st || ''));
    var stN = Number(LO.stNum);
    var unpaidO = (stN === 10);
    var paidO = (stN === 20); /* 已支付待启动: 正版语义=支付后要手动点开启 */
    /* 正版按钮显隐(orderDetail 8932-8965):
       startBtn [20,35,22] / cancelBtn [10,20] / stopBtn [30,40,60,61] / continueBtn [60,61] */
    var canStart = (stN === 20 || stN === 22 || stN === 35);
    var canCancel = (stN === 10 || stN === 20);
    var canStop = (stN === 30 || stN === 40 || stN === 60 || stN === 61);
    var canCont = (stN === 60 || stN === 61);
    /* 双卡共存: 洗衣(2/滚筒/波轮)与洗鞋(4)各自保留一张当前订单卡, 互不覆盖.
       U.curOrd = { wash:{orderId,lastOrder}, shoe:{orderId,lastOrder} } 由
       uLoadOrders 恢复与 runOrder 写入; 这里渲染当前类型对应的卡. */
    /* 卡类型由 cards[ci2].title 决定(洗衣/洗鞋), LO.deviceTypeId 仅用于展示. */
    /* 正版订单页大字: "N号机型". 机器号一眼可见(用户点名要大字). */
    var oidC = String(cards[ci2].oid || '');
    /* 机器号以本单 detail 为准; 扫码态只在本单缺字段时兜底, 避免洗鞋卡显示成洗衣那台 */
    var devBig = LO.devNo || LO.dev || (U.result && (U.result.deviceNo || U.result.devNo)) || '-';
    h += '<div style="font-size:26px;font-weight:800;letter-spacing:.5px;margin:2px 0 8px">'
      + esc(String(devBig)) + (String(devBig) !== '-' ? ' 号机' : '')
      + '<span style="font-size:13px;font-weight:600;color:var(--fg-muted);margin-left:10px">'
      + esc(LO.mode || '') + '</span></div>';
    if(oidC){
      h += '<div class="row" style="align-items:center;gap:8px">'
        + '<div style="flex:1">' + kv('订单号', oidC) + '</div>'
        + '<button class="btn-f" data-ucopy="' + esc(oidC) + '" style="flex:0 0 auto">复制</button>'
        + '</div>';
    }
    h += kv('状态', LO.st || '-', doneO ? 'ok' : (unpaidO ? 'warn' : ''));
    /* 正版 60/61 渲染 errorCode + 故障- + shortErrMsg, 可点进 orderError 页.
       这里至少把码与短消息摊在卡上, 用户能看到机器到底怎么了. */
    if((stN === 60 || stN === 61) && (LO.errorCode || LO.errMsg)){
      h += kv('故障码', String(LO.errorCode || '') + (LO.errMsg ? ('  ' + String(LO.errMsg)) : ''), 'warn');
    }
    /* 洗衣剩余时间: 服务端 remainTime(秒), 本地锚点推算, 每 15s 轮询校准.
       运行中(30/40)显示大字倒计时; 其它状态显示事实状态. */
    var runO = (stN === 30 || stN === 40);
    if(runO && LO.remain != null){
      var rsecs = Number(LO.remain) || 0;
      if(UPoll.rnAnchor){
        rsecs = Math.max(0, rsecs - Math.floor((Date.now() - UPoll.rnAnchor) / 1000));
      }
      var rh = Math.floor(rsecs / 3600), rm = Math.floor((rsecs % 3600) / 60), rs = rsecs % 60;
      h += '<div id="uWashRemain" style="font-size:24px;font-weight:800;color:var(--accent);margin:4px 0">'
        + '剩余 ' + (rh > 0 ? rh + ':' : '') + (rm < 10 ? '0' : '') + rm + ':' + (rs < 10 ? '0' : '') + rs
        + '</div>';
      h += '<div class="sub">以服务端事实为准, 15 秒自动校准一次.</div>';
    }else{
      /* remainTime 单位是秒(count-down: hour=count/3600), 不再当分钟显示 */
      /* 正版已预约/已支付态不渲染"剩余"(没有 remainTime 就没有这一行),
         原来无条件画 "剩余 读取中" 属臆造. */
      if(!doneO && !runO && LO.remain != null) h += kv('剩余', LO.remain + ' 秒');
    }
    if(LO.price != null) h += kv('金额', LO.price + ' 元');
    /* 正版卡面不显示开始/结束时间, 都收进"查看详情"折叠里; ISO 原文也不该裸露. */
    if(unpaidO){
      /* 每张卡自己的倒计时: 该单 countDown 为锚点本地推算, 归零即删卡 */
      /* 只读锚点, 不在这里重设. 旧实现每次 paint 都拿服务端上次轮询的 payLeft 快照
         覆盖锚点(那份快照比本地推算大几秒), 滚动触发重绘时界面时间会突然变大一小下,
         再被 1s 心跳算回来 -- 用户看到的就是"闪一下不同时间再跳回". 校准交给 uSetCd. */
      if(LO.payLeft != null) uSetCd(oidC, LO.payLeft);
      var cdv = UO.cd[oidC];
      if(cdv){
        var leftV = Math.max(0, cdv.left - Math.floor((Date.now() - cdv.at) / 1000));
        var mmV = Math.floor(leftV / 60), ssV = leftV % 60;
        h += '<div id="uCd_' + esc(oidC) + '" style="font-size:20px;font-weight:800;color:var(--warning,#d29922);margin:4px 0">'
          + mmV + ':' + (ssV < 10 ? '0' : '') + ssV + '后自动取消</div>';
        h += '<div class="sub">超过时间后未启动, 设备将自动释放(状态 51). 关单由服务端做, 本地只收卡.</div>';
      }else{
        h += '<div class="sub">自动取消倒计时读取中, 稍后自动刷新.</div>';
      }
    }
    var pctO = (UPoll && UPoll.pct !== undefined && UPoll.pct >= 0) ? UPoll.pct : -1;
    if(pctO >= 0){
      h += '<div class="pbar' + (doneO ? ' done' : '') + '"><i style="width:"'
        + Math.max(3, Math.min(100, pctO)) + '%"></i></div>';
      h += '<div class="sub">进度 ' + Math.round(pctO) + '%' + (doneO ? ' (已完成)' : '') + '</div>';
    }
    h += '<div class="row" style="margin-top:9px">'
      + '<button class="btn-b btn-f" data-upoll="'+esc(oidC)+'">刷新状态</button>'
      + (unpaidO ? '<button class="btn-p btn-f" data-upay="'+esc(oidC)+'">去支付</button>' : '')
      + (canStart ? '<button class="btn-p btn-f" data-ustart="'+esc(oidC)+'">开启洗衣机</button>' : '')
      + (canCont ? '<button class="btn-b btn-f" data-ucont="'+esc(oidC)+'">继续洗衣</button>' : '')
      + (canStop ? '<button class="btn-r btn-f" data-ustop="'+esc(oidC)+'">提前结束</button>' : '')
      + '<button class="btn-f" data-ualarm="'+esc(oidC)+'">完成提醒</button></div>';
    if(paidO){
      h += '<div class="sub">已支付, 还没启动. 正版语义 = 付完款后<b>手动点"开启洗衣机"</b>, '
        + '服务端把启动指令下发给设备(状态 21 启动中 -> 30/40 运行中), 点上面按钮即可.</div>';
    }
    /* 正版 OrderDetailHeader 展开后的三行(13740-13796):
       下单时间 / 运行程序 / 洗衣价格 / 支付金额 */
    if(LO.start || LO.cycle || LO.washPrice != null || LO.payment != null){
      h += '<details style="margin:6px 0"><summary style="cursor:pointer;font-size:13px;color:var(--fg-muted)">查看详情</summary>'
        + (LO.start ? kv('下单时间', uFmtTime(LO.start)) : '')
        + (LO.end ? kv('结束时间', uFmtTime(LO.end)) : '')
        + (LO.cycle ? kv('运行程序', String(LO.cycle)) : '')
        + (LO.washPrice != null ? kv('洗衣价格', String(LO.washPrice) + ' 元') : '')
        + (LO.payment != null ? kv('支付金额', Number(LO.payment).toFixed(2) + ' 元') : '')
        + (Number(LO.ticketPayValue) > 0 ? kv('店铺小票', (Number(LO.ticketPayValue) / 100).toFixed(2) + ' 票') : '')
        + '</details>';
    }
    /* 正版 status<20 有"我已支付"蓝链: GET app/order/query 自查, 3 秒后回拉 */
    if(unpaidO){
      h += '<div class="sub"><a href="javascript:;" data-ucpaid="' + esc(oidC)
        + '" style="color:#2f81f7">我已支付, 点这里刷新</a></div>';
    }
    if(canCancel){
      h += '<div class="row"><button class="btn-r btn-f" data-ucancel="'+esc(oidC)+'">取消订单</button></div>';
      h += '<div class="sub">' + (unpaidO
        ? '这笔还没支付(状态 10). 轮询 5 秒一次, 也可以点去支付或到正版 App 付款, 付完这里自动变.'
        : '已支付还没启动(状态 20), 正版同样给取消入口; 启动之后只剩提前结束.') + '</div>';
    }else if(canStop){
      h += '<div class="sub">机器已启动, 正版不提供取消, 用上面提前结束中止. 正版说明: 金额不退还, 机器会先清空残留水.</div>';
    }else{
      h += '<div class="sub">状态以服务端为准, 这一步没有可用操作.</div>';
    }
    h += '</div>'; /* 每张当前订单卡独立收口 */
  }

/* ---- 不再画"选择机器" ----

   U.result 就是这台, 再列同店全部机器只会让人误以为还要再选一次.

  /* ---- 下单(扫码后) ---- */

    if(!devBig2){ devBig2 = ''; } /* 没有编号就不显示假号, deviceId 不是机器号 */

      + badge(U_PROG.loaded ? (U_PROG.models.length + ' 种程序')

    h += '<div style="display:flex;align-items:baseline;gap:10px;margin:2px 0 8px">'
      + '<span style="font-size:24px;font-weight:800;letter-spacing:.5px">'
      + esc(String(devBig2 || '-')) + (devBig2 ? ' 号机' : '') + '</span>'
      + '<span style="font-size:12.5px;color:var(--fg-muted)">'
      + esc(U.result.deviceTypeName || '') + '</span>'
      + '<button class="btn-f" id="uDevRefresh" style="margin-left:auto;padding:5px 12px">刷新状态</button>'
      + '</div>';
    h += '<div class="sub">换机器: 重扫机器上的码, 或回到上面"预约机器"里换一台.</div>';
    if(U_PROG.err){
      h += '<div class="sub" style="color:var(--danger)">' + esc(U_PROG.err) + '</div>';
      h += '<div class="row" style="margin-top:9px">'
        + '<button class="btn-b btn-f" id="uProgBtn">重新读取价格表</button></div>';
    }else if(!U_PROG.loaded){
      h += '<div class="empty">正在向机器读取洗涤程序与价格...</div>';
    }else{
      var anyHide = U_PROG.models.some(function(x){ return !!x.hide; });
      var vis = U_PROG.models.filter(function(x){ return !x.hide || U_PROG.expand; });
      h += vis.map(function(m){
        var on = String(U_SEL.mode) === String(m.workModelId);
        return '<div class="wm' + (on ? ' on' : '') + '" data-wm="' + esc(m.workModelId) + '">'
          + '<div class="wm-l"><div class="wm-n">' + esc(m.workModelName)

          + '<div class="wm-d">' + esc(m.description || '') + '</div>'
          + (m.tags && m.tags.length ? '<div class="wm-t">' + m.tags.map(function(t){
              return '<span class="tg">' + esc(t) + '</span>'; }).join('') + '</div>' : '')
          + '</div>'
          + '<div class="wm-r"><div class="wm-p">' + uYuan(uBaseFen(m)) + '元'
          + (Number(m.isPromotion) && Number(m.promotionPrice) < Number(m.basePrice)
              ? '<span style="font-size:12px;color:var(--fg-muted);text-decoration:line-through;margin-left:4px">'
                + uYuan(m.basePrice) + '</span>' : '')
          + '</div>'
          + '<div class="wm-m">' + m.time + '分钟</div></div></div>';
      }).join('');

      if(anyHide && !U_PROG.expand){
        h += '<div class="row"><button class="btn-f" id="uProgMore">查看更多程序</button></div>';
      }

      /* 附加项统一遍历(正版 _l(additionParams, ...)), 不只水温 */
      var cm = uCurModel();
      var aps2 = uApListOf(cm);
      for(var ai=0; ai<aps2.length; ai++){
        var a2 = aps2[ai];
        h += '<div class="lab">' + esc(uApLabel(a2)) + '</div>';
        h += '<div class="row"><select data-uap="' + esc(a2.key) + '"></select></div>';
      }
      var do3 = uDryOpts(cm);
      if(do3.length){
        /* 正版 dryer-tit: title + "（每10分钟 washPrice 元）" */
        h += '<div class="lab">' + esc((cm.additionDryTime && cm.additionDryTime.title) || '烘干时间')
          + ' <span style="font-weight:400;color:var(--fg-muted)">(每10分钟 '
          + uYuan(uBaseFen(cm)) + ' 元)</span></div>';
        h += '<div class="row"><select id="uDryT"></select></div>';
      }
      var dp0 = uLiquidPick(cm, 'wp_detergentGearId');
      h += '<div class="lab">洗衣液'
        + (dp0.st === 3 ? ' <span style="color:var(--danger)">(已缺液)</span>' : '')
        + (dp0.st === 4 ? ' <span style="color:var(--danger)">(液体异常)</span>' : '')
        + '</div>';
      if(dp0.st === 3 || dp0.st === 4){
        h += '<div class="sub" style="color:var(--danger)">'
          + (dp0.st === 3 ? '已缺液，联系商家' : '液体异常，联系商家') + '</div>';
      }else{
        h += '<div class="row"><select id="uDet"></select></div>';
      }
      var xp0 = uLiquidPick(cm, 'wp_disinfectantGearId');
      h += '<div class="lab">除菌液'
        + (xp0.st === 3 ? ' <span style="color:var(--danger)">(已缺液)</span>' : '')
        + (xp0.st === 4 ? ' <span style="color:var(--danger)">(液体异常)</span>' : '')
        + '</div>';
      if(xp0.st === 3 || xp0.st === 4){
        h += '<div class="sub" style="color:var(--danger)">'
          + (xp0.st === 3 ? '已缺液，联系商家' : '液体异常，联系商家') + '</div>';
      }else{
        h += '<div class="row"><select id="uDis"></select></div>';
      }
      if(cm && cm.additionDevices && (uLiquidOf(cm,'wp_detergentGearId') || uLiquidOf(cm,'wp_disinfectantGearId'))){
        h += '<div class="sub">洗涤剂由机器自动投放, 洗衣液与除菌液相差 20 分钟投放.</div>';
      }
      h += '<div class="sum" id="uSum"></div>';
      /* 正版不管 BLOCK 与否都显示公告, 只是 BLOCK 才把下单键置灰 */
      if(U_PROG.blockInfo){
        h += '<div class="row" style="color:var(--danger);font-weight:700">'
          + esc(U_PROG.blockInfo.title) + '</div>'
          + '<div class="sub" style="color:var(--danger)">' + esc(U_PROG.blockInfo.body) + '</div>';
      }
      h += '<div class="row"><button class="btn-p btn-f" id="uOrderBtn"'
        + (U_PROG.blockOrder ? ' disabled style="opacity:.5"' : '') + '>下单</button></div>';
      h += '<div class="sub">U净 下单即扣款, 没有单独的钱包也不预充值; '
        + '价格由服务端按机型与选项实时计算.</div>';
      if(U_PROG.warmTip) h += '<div class="sub" style="white-space:pre-line">' + esc(U_PROG.warmTip) + '</div>';
    }
    h += '</div>';
  }

  /* ---- 历史订单 ---- */
  if(signed){
    /* UO.items 只装进行中单, 历史终态单在 UO.hist -- 只数 items 会让"历史 10 条"显示成"0 条". */
    h += '<div class="card"><h2>订单记录 '
      + badge(UO.loaded
          ? ('进行中 ' + UO.items.length + ' 条 / 历史 ' + UO.hist.length + ' 条')
          : '-')+'</h2>';
    h += '<div class="row">'
      + '<button class="btn-f" id="uOrdAll">全部历史订单</button>'
      + '<button class="btn-f" id="uOrdRefresh">刷新</button></div>';
    h += '<div class="sub">历史订单放在单独一页, 不占主页. 当前订单的状态在上面的订单卡里.</div>';
    h += '</div>';
  }

  host.innerHTML = h;
  uInitSel();

  var el;
  if((el=$('uSend'))) el.onclick = (function(b){ return function(){ uSendCode(b); }; })(el);
  if((el=$('uIn'))) el.onclick = uLogin;
  if((el=$('uOut'))) el.onclick = function(){
    confirmBox('退出登录', '退出后本地保留账号, 下次可以直接切回来.', '退出', uLogout);
  };
  if((el=$('uSwitch'))) el.onclick = function(){ openAccManager('laundry'); };
  if((el=$('uSaved'))) el.onclick = function(){
    openAccPicker('laundry', function(a){ if(a) uSwitch(a); });
  };
  if((el=$('uScanPick'))) el.onclick = uScanPick;
  if((el=$('uResolve'))) el.onclick = uScan;
  if((el=$('uOpenFind'))) el.onclick = function(){
    pushPage({ title:'找洗衣机', sub:'定位 -> 建筑 -> 机器', render:pageFindMachine });
  };
  if((el=$('uOrderBtn'))) el.onclick = uOrderConfirm;
  if((el=$('uProgBtn'))) el.onclick = function(){ U_PROG.loaded = false; uLoadProgram(); };
  if((el=$('uProgMore'))) el.onclick = function(){ U_PROG.expand = true; paint(); };
  Array.prototype.forEach.call(host.querySelectorAll('[data-wm]'), function(n){
    n.onclick = function(){ uPickModel(n.getAttribute('data-wm')); };
  });
  ['uDet','uDis','uDryT'].forEach(function(id){
    var n = $(id);
    if(n) n.onchange = function(){ uReadSel(); var s2 = $('uSum');
      if(s2) s2.textContent = uProgName() + ' / 合计 ' + uYuan(uTotalFen()) + ' 元';
      log('选项变更, 合计 ' + uYuan(uTotalFen()) + ' 元', 'w'); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('select[data-uap]'), function(n){
    n.onchange = function(){ uReadSel(); var s2 = $('uSum');
      if(s2) s2.textContent = uProgName() + ' / 合计 ' + uYuan(uTotalFen()) + ' 元';
      log('附加项 ' + n.getAttribute('data-uap') + '=' + n.value
        + ', 合计 ' + uYuan(uTotalFen()) + ' 元', 'w'); };
  });
  /* 多卡: 每个按钮只操作自己那张卡的订单号(重复 id 只能绑到第一张, 洗鞋卡点了没反应) */
  Array.prototype.forEach.call(host.querySelectorAll('[data-upoll]'), function(n){
    n.onclick = function(){ uTickById(n.getAttribute('data-upoll')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-upay]'), function(n){
    n.onclick = function(){ uPayById(n.getAttribute('data-upay')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ustart]'), function(n){
    n.onclick = function(){ uStartById(n.getAttribute('data-ustart')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ualarm]'), function(n){
    n.onclick = function(){ uAlarmById(n.getAttribute('data-ualarm')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ucancel]'), function(n){
    n.onclick = function(){ uCancel(n.getAttribute('data-ucancel')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ustop]'), function(n){
    n.onclick = function(){ uStopById(n.getAttribute('data-ustop')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ucopy]'), function(n){
    n.onclick = function(){
      var v = n.getAttribute('data-ucopy') || '';
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(v);
        }else{
          var ta = document.createElement('textarea');
          ta.value = v; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        }
        toast('已复制');
      }catch(e){ toast('复制失败: ' + e.message); }
    };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ucpaid]'), function(n){
    n.onclick = function(){ uSyncPaid(n.getAttribute('data-ucpaid')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-ucont]'), function(n){
    n.onclick = function(){ uContinueById(n.getAttribute('data-ucont')); };
  });
  if((el=$('uDevRefresh'))) el.onclick = function(){
    if(!U.result){ toast('先选一台机器'); return; }
    uRefreshDev();

  fmAutoPoll();
  if((el=$('uOrdAll'))) el.onclick = function(){
    pushPage({ title:'历史洗衣订单', sub:'U净 orders/history', render:pageLaundryOrders });

    n.onclick = function(){ uPickDevice(n.getAttribute('data-dev')); };
  });
  /* 有定位权限就自动定位并拉附近建筑, 不用手点 */
  fmAuto();

/* 历史订单页: 只做列表 + 展开明细, 与主页解耦.
   读 UO.hist(终态单), 不读 UO.items(当前单) -- 这两个数组的用途不同, 混用会让历史页恒空. */
function pageLaundryOrders(host){
  var h;
  if(!UO.histLoaded && !UO.loaded){ uLoadOrders(); h = '<div class="empty">加载中...</div>'; }
  else if(!UO.hist.length) h = '<div class="empty">还没有已结束的订单. 洗衣机跑完(或取消)之后这里才会有记录.</div>';
  else h = UO.hist.map(function(o){
    var id = o.id || o.orderId || o.orderNo;
    return uOrdItem(o, UO.open[id]);
  }).join('');
  host.innerHTML = '<div class="card"><h2>历史订单 '
      + badge(UO.hist.length + ' 条')+'</h2>' + h + '</div>'
    + '<div class="card"><div class="row"><button class="btn-f" id="uoRefresh">刷新</button></div>'
    + '<div class="sub">点任意一条展开明细. 这里只列已结束的单(完成/取消/超时/故障); 进行中的单在主页订单卡.</div></div>';
  if($('uoRefresh')) $('uoRefresh').onclick = function(){ UO.loaded = false; UO.histLoaded = false; uLoadOrders(); paint(); };
  Array.prototype.forEach.call(host.querySelectorAll('[data-uord]'), function(n){
    n.onclick = function(){ uToggleOrder(n.getAttribute('data-uord')); };
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-upay]'), function(n){
    n.onclick = function(ev){
      ev.stopPropagation();
      var id = n.getAttribute('data-upay');
      if(String(U.orderId) !== String(id)){ U.orderId = id; }
      uPayOrder();
    };
  });
  /* 取消统一走 uCancel: 白名单(10/20)、二次确认、失败文案都与主页订单卡一致,
     不再在历史页里维护第二套取消逻辑. */
  Array.prototype.forEach.call(host.querySelectorAll('[data-ucancel]'), function(n){
    n.onclick = function(ev){
      ev.stopPropagation();
      uCancel(n.getAttribute('data-ucancel'));
    };
  });
}

/* ============================================================
   7. 日志页
   ============================================================ */
function pageLog(host){
  var h = '<div class="card"><h2>运行日志 '+badge(LOG.length+' 行', LOG.length?'on':'')+'</h2>';
  if(!LOG.length) h += '<div class="empty">还没有日志</div>';
  else{
    h += '<div class="log">'+LOG.map(function(l){
      return '<div class="'+l.c+'"><span class="t">'+l.t+'</span> '+esc(l.m)+'</div>';
    }).join('')+'</div>';
  }
  h += '<div class="row" style="margin-top:9px">'
    + '<button class="btn-f" id="logClear">清空</button>'
    + '<button class="btn-f" id="logCopy">复制</button></div>';
  h += '<div class="sub">日志已持久化(本机 localStorage, 重启不丢, 上限 300 条); 清理与开关在设置页.</div>';
  h += '</div>';
  host.innerHTML = h;
  if($('logClear')) $('logClear').onclick = function(){
    if(!LOG.length){ toast('日志已经是空的'); return; }
    confirmBox('清空日志', '会清掉全部 ' + LOG.length + ' 行.', '清空', function(){ LOG = []; paint(); });
  };
  if($('logCopy')) $('logCopy').onclick = function(){
    var txt = LOG.map(function(l){ return l.t+' '+l.m; }).join('\n');
    if(!txt){ alertBox('没有日志', '日志是空的.'); return; }
    if(HASNATIVE && window.HzNative.copy){
      try{ window.HzNative.copy(txt); toast('已复制'); return; }catch(e){}
    }
    if(navigator.clipboard){ navigator.clipboard.writeText(txt); toast('已复制'); }
    else alertBox('复制不可用', '当前环境没有剪贴板接口.');
  };
}

   6.10 设置里的两个子页: 用户协议 / 权限

function pageTerms(host){
  var h = '';
  h += '<div class="card"><h2>协议状态 '
    + badge(TERMS.agreed && TERMS.ver >= TERMS_VER ? ('已同意 v' + TERMS.ver) : '未同意',
            TERMS.agreed && TERMS.ver >= TERMS_VER ? 'on' : 'bad') + '</h2>';
  h += kv('当前版本', 'v' + TERMS_VER);
  h += kv('同意时间', TERMS.at ? ts2s(TERMS.at) : '-');
  h += '<div class="sub">版本号变了会重新征求一次同意, 不会静默替换.</div>';
  h += '</div>';
  h += termsDocHTML();
  h += '<div class="card"><h2>操作</h2>'
    + '<div class="row"><button class="btn-f btn-f" id="tsReopen">重新走一次引导</button></div>'
    + '<div class="sub">把同意状态清掉, 下次启动重新弹. 一般不需要.</div>'
    + '</div>';
  host.innerHTML = h;
  if($('tsReopen')) $('tsReopen').onclick = function(){
    confirmBox('重新走引导', '会清掉本机记录的同意状态, 下次启动重新弹协议与权限页.', '确定', function(){
      TERMS.agreed = 0; TERMS.ver = 0; TERMS.permSeen = 0; termsSave();
      toast('已重置, 下次启动生效');
      paint();
    });
  };
}

function pagePerms(host){
  var st = permState();
  var h = '';
  h += '<div class="card"><h2>权限状态 '
    + badge(permCount(st) + ' / ' + PERM_DEF.length, permCount(st) >= 3 ? 'on' : 'warn') + '</h2>';
  PERM_DEF.forEach(function(p){
    var ok = !!st[p.k];
    h += '<div class="perm"><i class="' + (ok?'ok':'no') + '">' + (ok?'&#10003;':'') + '</i>'
      + '<div><b>' + esc(p.n) + '</b><p>' + esc(p.why) + '</p></div>'
      + (ok ? '<button disabled style="opacity:.45">已授权</button>'
            : '<button class="btn-b" data-perm="' + p.req + '">授权</button>')
      + '</div>';
  });
  h += '<div class="row" style="margin-top:9px">'
    + '<button class="btn-f btn-f" id="pmAgain">重新检测</button></div>';
  h += '<div class="sub">Android 12 起精确闹钟要单独允许; 安装未知应用也各是独立开关.</div>';
  h += '</div>';
  h += '<div class="card"><h2>被永久拒绝怎么办</h2><div class="tos">'
    + '<p>如果点了授权但系统不再弹窗, 说明被记成"不再询问". '
    + '这时只能去系统设置里手动打开:</p>'
    + '<p>设置 - 应用 - 水衣管家 - 权限</p>'
    + '<p>精确闹钟在: 设置 - 应用 - 水衣管家 - 闹钟和提醒</p>'
    + '<p>安装未知应用在: 设置 - 应用 - 水衣管家 - 安装未知应用</p>'
    + '</div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-perm]'), function(n){
    n.onclick = function(){ askPerm(n.getAttribute('data-perm')); };
  });
  if($('pmAgain')) $('pmAgain').onclick = function(){ paint(); };
}

function themeName(id){
  var t = THEMES.filter(function(x){ return x.id === id; })[0];

}
function applyTheme(id){
  ACC.theme = id; accSave();

  }
}

/* 赞赏码: 原图同时保留在 assets/reward.jpg, 供重新编码时取用. */
function showReward(){
  modal({ title:'请我喝杯咖啡',
    body: '<div style="text-align:center">'
      + '<img id="rewardImg" src="' + REWARD_IMG + '" alt="赞赏码" '
      + 'style="width:240px;max-width:78%;border-radius:12px;cursor:zoom-in">'
      + '<div class="sub" style="margin-top:10px;text-align:left">'
      + '用微信扫这个码就能赞赏, 金额随意, 完全自愿.'
      + '<br>本软件始终开源免费, 赞赏不会解锁任何功能, 不赞赏也一样用.'
      + '<br><span style="opacity:.7">出水与洗衣的钱是付给平台的, 与这里无关.</span>'
      + '</div></div>',
    actions: [{ label:'关闭' }] });
  /* 小屏上 240px 的码可能扫不动, 点一下铺满屏幕再看. */
  var ri = $('rewardImg');
  if(ri) ri.onclick = function(){
    modal({ title:'赞赏码',
      body: '<div style="text-align:center">'
        + '<img src="' + REWARD_IMG + '" alt="赞赏码" style="width:100%;max-width:100%;border-radius:10px">'
        + '<div class="sub" style="margin-top:8px">微信扫一扫, 或直接长按识别</div></div>',
      actions: [{ label:'关闭' }] });
  };
}

  THEMES.forEach(function(t){

/* 只发安卓包. 万一被当网页打开, 直接停住并说清楚, 不做半吊子降级. */
function nativeOnlyGate(){
  if(HASNATIVE) return false;
  document.body.innerHTML = '<div style="padding:28px;font:15px/1.7 system-ui;color:#e6edf3;background:#0d1117;min-height:100vh">'
    + '<b style="font-size:17px">这个包只能在安卓 App 里运行</b><br><br>'
    + '当前没有检测到原生桥, 说明是被当网页打开了.<br>'
    + '网页与 iOS 分支已经按你的要求删掉, 请装 APK.'
    + '</div>';
  return true;
}

/* ---------------------------------------------------------------
   更新后第一次打开弹一次更新内容.
   判据是"上次看过的版本号 != 当前版本号", 所以装新版后必弹一次, 之后同版本不再弹.
   从没看过(全新安装)不弹 -- 新用户没有"更新"这回事, 弹了只会莫名其妙.
   --------------------------------------------------------------- */
var SEEN_KEY = 'hz_seen_ver';

function seenLoad(){
  try{ return String(localStorage.getItem(SEEN_KEY) || ''); }catch(e){ return ''; }
}
function seenSave(v){
  try{ localStorage.setItem(SEEN_KEY, String(v)); }catch(e){}
}

/* 判断"是不是老用户升级上来的": 从没记过 seen 但本地已有别的数据, 说明装过旧版.
   旧版没写过 seen, 所以第一条升级必须靠这个判据, 否则升级上来的第一批人一个都看不到. */
function seenLegacy(){
  try{
    if(localStorage.getItem('hz_logs')) return true;
    if(localStorage.getItem('hz_accounts_v3')) return true;
    if(localStorage.getItem(ACC_KEY)) return true;
  }catch(e){}
  return false;
}

function changelogPopupOnce(){
  var seen = seenLoad();
  if(!seen){
    if(!seenLegacy()){ seenSave(APP_VER); return; }   /* 真·全新安装, 不弹 */
    seen = '';                                        /* 老用户升级上来, 走下面弹一次 */
  }else if(cmpVer(seen, APP_VER) === 0){
    return;                                           /* 这一版看过了 */
  }
  var o = clNotesOf(APP_VER, null);
  seenSave(APP_VER);                               /* 先记, 免得弹窗期间被重入再弹 */
  if(!o.notes.length) return;
  var body = '<div class="sub" style="margin-bottom:8px">已更新到 v' + esc(APP_VER)
    + (o.date ? (' (' + esc(o.date) + ')') : '') + ', 这一版改了:</div>'
    + '<ul style="margin:0 0 0 18px;padding:0">';
  o.notes.forEach(function(x){
    body += '<li style="margin:6px 0;line-height:1.55">' + esc(String(x)) + '</li>';
  });
  body += '</ul>';
  alertBox('更新内容', body, [{ label:'知道了' }]);
}

function boot(){
  if(nativeOnlyGate()) return;
  try{ logPersistLoad(); }catch(e){} /* 先装历史日志, 再写"就绪", 重启不丢 */
  // 首帧已经能画了, 让原生启动层淡出. 开屏只有原生这一层, 不重复播第二次
  try{ if(window.HzNative && HzNative.ready) HzNative.ready(); }catch(e){}
  termsLoad();
  alLoad();
  alAutoLoad();
  alPollStart();
  verLoad();
  log('就绪. 原生桥=' + (HASNATIVE ? ('已接入(' + window.HzNative.platform() + ')') : '无(浏览器模式)'));
if((ACC.water||[]).length || (ACC.laundry||[]).length) dumpSoon();
log('账号库: 取水 ' + (ACC.water||[]).length + ' 个, 洗衣 ' + (ACC.laundry||[]).length + ' 个');
log('主题: ' + themeName(ACC.theme));
log('两个账号体系与两套账单互相独立, 不混算');

  enterApp('water');
  if(S.token){ wLoadBalance(); wLoadOrders(); }
  if(U.token){ uLoadOrders(); }
  gateStart();
  /* 引导层(协议/权限)优先; 没有任何引导层要显示时才弹更新内容 */
  try{
    var g = $('gate');
    if(!g || g.className.indexOf('on') < 0) changelogPopupOnce();
  }catch(e){}
}
