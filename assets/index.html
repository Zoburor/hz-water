<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>水衣管家</title>

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">

<style>
/* ===== iOS 适配 ===== */
/* 1. 刘海与底部横条: 页面已经用 env(safe-area-inset-*), 这里再补一层内边距兜底 */
/* 2. 输入框字号 < 16px 时 iOS 会自动放大页面, 单独提到 16px 挡住 */
/* 3. -webkit-fill-available 让 100vh 在 Safari 里真的是视口高度 */
/* iOS 专属: 由 JS 给根元素加 .ios 类, 比 @supports 可靠 */
html.ios input, html.ios select, html.ios textarea{ font-size:16px }
html.ios body{ -webkit-tap-highlight-color:transparent }
/* iOS 主屏模式下没有滚动惯性链, 锁住横向上划 */
html.ios, html.ios body{ overscroll-behavior:none }
/* 刘海屏: 顶部留出状态栏高度, 底部留出 home 指示条 */
html.ios .hd{ padding-top:max(6px, env(safe-area-inset-top)) }
html.ios .nav{ padding-bottom:max(4px, env(safe-area-inset-bottom)) }

@supports (-webkit-touch-callout: none){
  html{ height:-webkit-fill-available }
  body{ min-height:-webkit-fill-available }
  input,select,textarea{ font-size:16px }
  /* 关掉长按选词与电话识别, 免得上下一划就选中整段 */
  body{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none }
  input,select,textarea{ -webkit-user-select:text; user-select:text }
  /* 去掉点按高亮 */
  *{ -webkit-tap-highlight-color:transparent }
}
/* 相机浮层: 网页版扫码用 */
#webCam{position:fixed;inset:0;z-index:9000;background:#000;display:flex;align-items:center;justify-content:center}
#webCam .wc-box{position:relative;width:100%;max-width:640px;padding:0 14px 14px;box-sizing:border-box}
#webCam video{width:100%;border-radius:14px;background:#000;display:block}
#webCam .wc-tip{color:#eaf3ff;font-size:13px;text-align:center;margin:10px 0}
#webCam .wc-row{display:flex;gap:9px}
#webCam .wc-row button{padding:12px 10px}
/* iOS 主屏模式下滚动回弹会露出白边, 锁住 overscroll */
body{ overscroll-behavior-y:contain }

/* ===== 色板取自 GitHub Primer 官方主题 ===== */
:root,[data-theme="dark"]{
  --bg:#0d1117; --bg-subtle:#161b22; --bg-inset:#21262d;
  --border:#30363d; --fg:#e6edf3; --fg-muted:#8b949e; --fg-subtle:#6e7681;
  --accent:#58a6ff; --accent-bg:#1f6feb; --accent-fg:#ffffff;
  --success:#3fb950; --success-bg:#238636; --danger:#f85149; --danger-bg:#da3633;
  --warn:#d29922;
}
[data-theme="dimmed"]{
  --bg:#22272e; --bg-subtle:#2d333b; --bg-inset:#373e47;
  --border:#444c56; --fg:#adbac7; --fg-muted:#768390; --fg-subtle:#636e7b;
  --accent:#539bf5; --accent-bg:#316dca; --accent-fg:#ffffff;
  --success:#57ab5a; --success-bg:#347d39; --danger:#e5534b; --danger-bg:#c93c37;
  --warn:#c69026;
}
[data-theme="hc"]{
  --bg:#0a0c10; --bg-subtle:#0f1318; --bg-inset:#151b23;
  --border:#6e7681; --fg:#f0f3f6; --fg-muted:#9ea7b3; --fg-subtle:#848d97;
  --accent:#71b7ff; --accent-bg:#409eff; --accent-fg:#0a0c10;
  --success:#26cd4d; --success-bg:#09b43a; --danger:#ff6a69; --danger-bg:#e5484d;
  --warn:#e09b13;
}
[data-theme="light"]{
  --bg:#ffffff; --bg-subtle:#f6f8fa; --bg-inset:#eaeef2;
  --border:#d0d7de; --fg:#1f2328; --fg-muted:#59636e; --fg-subtle:#6e7781;
  --accent:#0969da; --accent-bg:#1f883d; --accent-fg:#ffffff;
  --success:#1a7f37; --success-bg:#1f883d; --danger:#cf222e; --danger-bg:#cf222e;
  --warn:#9a6700;
}
[data-theme="light-hc"]{
  --bg:#ffffff; --bg-subtle:#ffffff; --bg-inset:#eaeef2;
  --border:#424a53; --fg:#0a0c10; --fg-muted:#4b535d; --fg-subtle:#57606a;
  --accent:#0349b4; --accent-bg:#1168d1; --accent-fg:#ffffff;
  --success:#055d20; --success-bg:#1a7f37; --danger:#a0111f; --danger-bg:#a0111f;
  --warn:#7d4e00;
}
[data-theme="colorblind"]{
  --bg:#0d1117; --bg-subtle:#161b22; --bg-inset:#21262d;
  --border:#30363d; --fg:#c9d1d9; --fg-muted:#8b949e; --fg-subtle:#6e7681;
  --accent:#58a6ff; --accent-bg:#1f6feb; --accent-fg:#ffffff;
  --success:#58a6ff; --success-bg:#1f6feb; --danger:#f0883e; --danger-bg:#bc4c00;
  --warn:#d29922;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  transition:background .18s ease,color .18s ease;
}
.hd{flex:none;padding:11px 16px 9px;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
.hd-r{display:flex;align-items:center;gap:8px}
.hd-back{flex:none;width:30px;height:30px;border-radius:6px;background:var(--bg-inset);
  color:var(--fg-muted);border:1px solid var(--border);font-size:17px;line-height:1;cursor:pointer;padding:0}
.hd-back.hide{visibility:hidden}
.hd-mark{display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;background:linear-gradient(160deg,#38d6f5,#1a45cc);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
  .hd-t{font-size:16px;font-weight:600}
.hd-s{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 18px}
.nav{flex:none;display:flex;background:var(--bg-subtle);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-i{flex:1;padding:6px 2px 7px;text-align:center;cursor:pointer;color:var(--fg-muted);font-size:10.5px}
.nav-i .ic{display:block;font-size:17px;line-height:1.25}
.nav-i.on{color:var(--accent)}

.card{background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;padding:12px 13px;margin-bottom:8px}
.card h2{margin:0 0 9px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.pill{font-size:10.5px;padding:0 7px;border-radius:99px;background:var(--bg-inset);
  color:var(--fg-muted);font-weight:400;border:1px solid var(--border)}
.pill.on{background:transparent;color:var(--success);border-color:var(--success)}
.pill.bad{background:transparent;color:var(--danger);border-color:var(--danger)}
.pill.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.sub{font-size:11.5px;color:var(--fg-muted);margin-top:7px;line-height:1.6}
.sub.warn{color:#b45309;background:#fffbeb;border-left:3px solid #f59e0b;padding:6px 8px;border-radius:4px}
.row{display:flex;gap:7px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
input,select{flex:1;min-width:0;padding:0 11px;border-radius:6px;background:var(--bg-inset);
  border:1px solid var(--border);color:var(--fg);font-size:13.5px;font-family:inherit;outline:none;
  height:34px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.2)}
button{padding:0 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg-inset);
  color:var(--fg);font-size:13.5px;font-family:inherit;font-weight:500;cursor:pointer;
  white-space:nowrap;height:34px}
button:active{opacity:.78}
button:disabled{opacity:.4;cursor:default}
.btn-p{background:rgba(63,185,80,.16);border-color:var(--success);color:var(--success);font-weight:700}
.btn-p:disabled{opacity:.45}
.btn-b{background:var(--accent-bg);border-color:rgba(240,246,252,.1);color:var(--accent-fg)}
.btn-r{background:var(--bg-inset);border-color:var(--danger);color:var(--danger)}
.btn-d{background:var(--danger-bg);border-color:rgba(240,246,252,.1);color:#fff}
.btn-w{flex:none;min-width:86px}
.btn-f{flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--fg-muted);flex:none}
.kv b{color:var(--fg);font-weight:500;text-align:right;word-break:break-all}
.kv b.ok{color:var(--success)}
.kv b.bad{color:var(--danger)}
.li{padding:9px 11px;border-radius:6px;background:var(--bg-inset);border:1px solid var(--border);
  margin-bottom:6px;cursor:pointer}
.li:last-child{margin-bottom:0}
.li-t{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.li-t span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-t b{font-weight:600;flex:none}
.li-s{font-size:11px;color:var(--fg-muted);margin-top:3px}
.li-d{margin-top:8px;padding:8px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:11.5px;line-height:1.7}
.li-d .kv{border-bottom:0;padding:2px 0;font-size:11.5px}
.pw{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;background:var(--bg-inset);
  border:1px solid var(--border);margin-bottom:6px;cursor:pointer}
.pw.on{border-color:var(--accent)}
.pw-n{font-size:13px}
.pw-p{font-size:11px;color:var(--fg-muted);margin-top:2px}
.pw-b{flex:none;font-size:10.5px;padding:0 7px;border-radius:99px;background:var(--bg);color:var(--fg-muted);border:1px solid var(--border)}
.pw-b.on{color:var(--success);border-color:var(--success)}
.log{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px;
  font-size:11px;line-height:1.65;font-family:ui-monospace,Menlo,Consolas,monospace;
  overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.log div{color:var(--fg-muted);padding:1px 0}
.log div.s{color:var(--success)}
.log div.e{color:var(--danger)}
.log div.w{color:var(--warn)}
.log .t{color:var(--fg-subtle)}
.empty{padding:20px 0;text-align:center;color:var(--fg-subtle);font-size:12.5px}

.mask{position:fixed;inset:0;background:rgba(1,4,9,.72);display:none;align-items:center;
  justify-content:center;z-index:200;padding:22px}
.mask.on{display:flex}
.dlg{width:100%;max-width:420px;background:var(--bg-subtle);border:1px solid var(--border);
  border-radius:12px;padding:16px;box-shadow:0 16px 32px rgba(1,4,9,.85);max-height:82vh;overflow-y:auto}
.dlg h3{margin:0 0 8px;font-size:15px;font-weight:600}
.dlg .dbody{font-size:13px;color:var(--fg-muted);line-height:1.65}
.dlg .dact{display:flex;gap:8px;margin-top:14px}
.dlg .dact button{flex:1}

.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(12px);
  background:var(--bg-inset);color:var(--fg);padding:8px 16px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:.18s;border:1px solid var(--border);max-width:80vw;
  text-align:center;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border:1px solid var(--border);border-radius:6px;padding:9px;cursor:pointer;background:var(--bg-inset)}
.th.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.28)}
.th-t{font-size:12px;font-weight:600;margin-bottom:6px}
.th-s{display:flex;gap:4px}
.th-s i{width:16px;height:16px;border-radius:3px;display:block;border:1px solid rgba(140,150,165,.35)}

/* ===== v6: 屏幕适配 ===== */
html,body{height:100%}
body{
  height:100vh;height:100dvh;max-height:100dvh;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
.hd,.body,.nav{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.body{padding-bottom:22px}
.nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
/* 横屏矮屏: 压缩头部与导航, 保证内容区高度 */
@media (orientation:landscape) and (max-height:540px){
  .hd{padding:6px 12px 5px}
  .hd-t{font-size:15px}
  .hd-s{display:none}
  .nav-i{padding:3px 2px 4px;font-size:10px}
  .nav-i .ic{font-size:15px;line-height:1.1}
  .body{padding:8px 10px 12px}
}
/* 平板/大屏: 卡片略微加大留白, 双列部分内容 */
@media (min-width:760px){
  .body{padding:14px 16px 24px}
  .card{padding:14px 16px;margin-bottom:10px}
  .themes{grid-template-columns:1fr 1fr 1fr}
}
/* 超宽时不至于一行太长 */
@media (min-width:1000px){
  .hd,.body,.nav{max-width:820px}
}

/* ===== v6: 引导层(用户须知 + 初始权限) ===== */
.gate{position:fixed;inset:0;z-index:400;background:var(--bg);display:none;flex-direction:column}
.gate.on{display:flex}
.gate-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 18px 10px;width:100%;max-width:760px;margin:0 auto}
.gate-f{flex:none;padding:11px 18px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);width:100%;max-width:760px;margin:0 auto}
.gate-t{font-size:19px;font-weight:600;margin:6px 0 4px}
.gate-s{font-size:12.5px;color:var(--fg-muted);margin-bottom:16px;line-height:1.6}
.perm{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.perm:last-child{border-bottom:0}
.perm i{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-style:normal;font-weight:600;margin-top:1px}
.perm i.ok{background:var(--success-bg);color:#fff}
.perm i.no{background:var(--bg-inset);color:var(--fg-muted);border:1px solid var(--border)}
.perm div{flex:1;min-width:0}
.perm b{font-size:13px;font-weight:600;display:block}
.perm p{margin:3px 0 0;font-size:11.5px;line-height:1.55;color:var(--fg-muted)}
.perm button{flex:none;height:28px;padding:0 11px;font-size:12px;margin-top:1px}

/* ===== v6: 条款正文 ===== */
.tos{font-size:12.5px;line-height:1.8;color:var(--fg-muted)}
.tos h4{margin:16px 0 6px;font-size:13px;color:var(--fg);font-weight:600}
.tos h4:first-child{margin-top:0}
.tos ol,.tos ul{margin:0;padding-left:19px}
.tos li{margin-bottom:5px}
.tos b{color:var(--fg);font-weight:600}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.55;padding:9px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ck-box{flex:none;width:18px;height:18px;margin:1px 0 0;border:1px solid var(--border);
  border-radius:4px;background:var(--bg);color:transparent;font-size:13px;line-height:16px;
  text-align:center;font-weight:700;transition:background .12s,border-color .12s}
.chk.lock{opacity:.55}
.chk.on .ck-box{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.ck-tx{flex:1;min-width:0}

/* ===== v6: 更新 / 镜像源 ===== */
.mirror{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.mirror:last-child{border-bottom:0}
.mirror s{flex:none;width:15px;text-decoration:none;font-size:11px;color:var(--fg-subtle);text-align:center}
.mirror b{flex:1;min-width:0;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mirror em{flex:none;font-style:normal;font-size:10.5px;padding:0 6px;border-radius:99px;
  border:1px solid var(--border);color:var(--fg-muted)}
.mirror em.on{color:var(--success);border-color:var(--success)}
.mirror em.bad{color:var(--danger);border-color:var(--danger)}

/* ===== v6: 进度条(洗衣剩余) ===== */
.pbar{height:6px;border-radius:99px;background:var(--bg-inset);overflow:hidden;margin:9px 0 3px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pbar.done i{background:var(--success)}

/* ===== v6: 找机器列表 ===== */
.fm{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:6px;
  background:var(--bg-inset);border:1px solid var(--border);margin-bottom:6px;cursor:pointer}
.fm.free{border-color:var(--success)}
.fm.busy{opacity:.72}
.fm-m{flex:1;min-width:0}
.fm-n{font-size:13px;font-weight:500}
.fm-s{font-size:11px;color:var(--fg-muted);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fm-r{flex:none;text-align:right}
.fm-d{font-size:11px;color:var(--fg-subtle)}
.fm-b{font-size:10.5px;padding:1px 7px;border-radius:99px;margin-top:3px;display:inline-block;
  border:1px solid var(--border);color:var(--fg-muted)}
.fm-b.on{color:var(--success);border-color:var(--success)}

/* ===== v6: 闹钟行 ===== */
.al{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.al:last-child{border-bottom:0}
.al b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al em{flex:none;font-style:normal;color:var(--fg-muted);font-size:11.5px}
.al button{flex:none;height:27px;padding:0 10px;font-size:11.5px}

/* ===== v6: 扫码(左大键 + 右设备码) ===== */
.scan2{display:flex;gap:10px;align-items:stretch;margin-bottom:9px}
.orline{display:flex;align-items:center;gap:10px;margin:2px 2px 9px;color:var(--fg-muted);font-size:11.5px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--border)}
.scan2-b{flex:1.25;min-width:0;display:flex;align-items:center;justify-content:center;
  gap:9px;padding:0 8px;border:0;border-radius:9px;overflow:hidden;
  background:var(--accent-bg);color:var(--accent-fg);font-family:inherit;cursor:pointer}
.scan2-b:active{opacity:.84}
.scan2-i{flex:none;font-size:23px;line-height:1;font-weight:400}
.scan2-t{font-size:15px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.scan2-r{flex:1;min-width:0;display:grid;grid-template-rows:1fr 1fr;gap:8px}
.scan2-r input{width:100%;height:100%;box-sizing:border-box;padding:0 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg-inset);color:var(--fg);
  font-size:12.5px;font-family:inherit;outline:none;text-align:center;min-height:0}
.scan2-r input:focus{border-color:var(--accent)}
.scan2-x{display:flex;gap:7px;min-height:0}
.scan2-x button{flex:1;height:100%;padding:0 4px;font-size:12.5px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg-subtle);color:var(--fg);
  font-family:inherit;cursor:pointer}
.scan2-b{min-height:74px}
/* 扫码大键: 整页最上面那个, 比别的按键都大 */
.bigscan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:92px;margin-bottom:6px;border:0;border-radius:11px;cursor:pointer;
  background:linear-gradient(135deg,#38d6f5,#1b8af2 55%,#1a45cc);color:#fff;
  box-shadow:0 3px 10px rgba(26,69,204,.28)}
.bigscan:active{opacity:.86;transform:translateY(1px)}
.bigscan-i{font-size:30px;line-height:1;font-weight:400}
.bigscan-t{font-size:18px;font-weight:700;letter-spacing:.5px}
/* 多卡余额一行 */
.wc{display:flex;align-items:center;gap:9px;padding:9px 11px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-2);cursor:pointer}
.wc-zero{opacity:.62}
.wc.on{border-color:var(--accent);background:rgba(88,166,255,.14)}
.wc.on .wc-n{color:var(--accent)}
.wc-n{font-size:13px;font-weight:600;color:var(--fg)}

<script>
'use strict';

/* ============================================================
   0. 基础工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function pad2(n){ return ('0'+n).slice(-2); }
function now(){ var t=new Date(); return pad2(t.getHours())+':'+pad2(t.getMinutes())+':'+pad2(t.getSeconds()); }
function esc(s){
  return String(s===null||s===undefined?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function jparse(t){ try{ return JSON.parse(t); }catch(e){ return null; } }
function ts2s(t){
  try{ return new Date(t).toLocaleString(); }catch(e){ return '-'; }
}

var LOG = [], LOG_CAP = 400;
var LOG_PERSIST = true; /* 持久化开关(设置页可改, 存 hz_logp) */
try{ LOG_PERSIST = localStorage.getItem('hz_logp') !== '0'; }catch(e){}
function logPersistSave(){
  try{
    if(!LOG_PERSIST) return;
    localStorage.setItem('hz_logs', JSON.stringify(LOG.slice(-300)));
  }catch(e){}
}
function logPersistLoad(){
  try{
    var a = JSON.parse(localStorage.getItem('hz_logs') || '[]');
    if(Array.isArray(a) && a.length && !LOG.length){ LOG = a; }
  }catch(e){}
}
function log(msg, cls){
  var flat = String(msg).split(String.fromCharCode(10)).join(' | ').split(String.fromCharCode(13)).join('');
  LOG.push({ t: now(), m: flat, c: cls || '' });
  if(LOG.length > LOG_CAP) LOG.shift();
  logPersistSave();
  if(CUR === 'log') paint();
}
function toast(msg){
  var el = $('toast'); if(!el) return;
  el.textContent = msg; el.className = 'toast on';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className = 'toast'; }, 1800);
}

/* 弹窗: opt = {title, body, actions:[{label, cls, fn}]} */
var MODAL_OPEN = false;
function modal(opt){
  var d = $('dlg');
  var html = '<h3>' + esc(opt.title || '提示') + '</h3>';
  html += '<div class="dbody">' + (opt.body || '') + '</div>';
  var acts = (opt.actions && opt.actions.length) ? opt.actions : [{ label:'知道了' }];
  html += '<div class="dact">';
  acts.forEach(function(a, i){
    html += '<button class="' + (a.cls || '') + '" data-act="' + i + '">' + esc(a.label) + '</button>';
  });
  html += '</div>';
  d.innerHTML = html;
  $('mask').className = 'mask on';
  MODAL_OPEN = true;
  Array.prototype.forEach.call(d.querySelectorAll('[data-act]'), function(b){
    b.onclick = function(){
      var a = acts[Number(b.getAttribute('data-act'))];
      closeModal();
      if(a && a.fn) a.fn();
    };
  });
}
function closeModal(){ $('mask').className = 'mask'; MODAL_OPEN = false; }
function alertBox(title, body, acts){ modal({ title:title, body:body, actions:acts }); }
function confirmBox(title, body, okLabel, fn){
  modal({ title:title, body:body, actions:[
    { label: okLabel || '确定', cls:'btn-d', fn: fn },
    { label:'取消' }
  ] });
}

var HASNATIVE = !!(window.HzNative && window.HzNative.isNative && window.HzNative.isNative());
var cbSeq = 0;
window.__hzCb = window.__hzCb || {};

/* ============================================================
   Web 运行层: iOS / Android 浏览器 / PWA 共用
   ------------------------------------------------------------
   原生 App 里有 HzNative 桥, 直接调系统能力.
   浏览器里没有桥, 这里用标准 Web API 顶上去:
     - 扫码     getUserMedia 取流 + jsQR 逐帧解 (iOS Safari 14.3+ 可用)
     - 相册     input[type=file] + FileReader + jsQR
     - 定位     navigator.geolocation
     - 提醒     Notification + 页面内定时器
     - 更新     跳发布页手动更新 (网页不能自装)
   本页只跑在安卓原生壳里, 网页与 iOS 分支已按用户要求删除.
   ============================================================ */
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var WEBQR = { running:false, stream:null, raf:0, canvas:null, ctx:null, cb:null, video:null };

/* jsQR 是 UMD 包, 内联后挂在 window.jsQR 上 */
function qrReady(){ return typeof window.jsQR === 'function'; }

/* iOS 上把输入框字号抬到 16px: 低于 16 时 Safari 会在聚焦时自动放大整页, 且不会自动缩回. */
if(IS_IOS){
  try{ document.documentElement.className += " ios"; }catch(e){}
}

/* 把一张图(Image/Video/Canvas)解成文本. 蓝色底纹的机器码用通道均值当灰度更稳 */
/* 灰度通道提取: 三种取法, 蓝色底纹的机器码靠 rg 最稳, 普通黑白码靠 lum */
function qrGray(d, n, mode, out){
  for(var i = 0, p = 0; i < n; i++, p += 4){
    var r = d[p], g = d[p + 1], b = d[p + 2];
    if(mode === 'rg'){ out[i] = (r + g) >> 1; }
    else if(mode === 'grn'){ out[i] = g; }
    else{ out[i] = (r * 299 + g * 587 + b * 114) / 1000; }
  }
  return out;
}

/* 直方图分位取上下界: 抗蓝底, 也抗局部反光 */
function qrRange(g, n, plo, phi){
  var hist = new Uint32Array(256);
  for(var i = 0; i < n; i++){ hist[g[i]]++; }
  var tl = n * plo;
  var lo = 0, acc = 0, v;
  for(v = 0; v < 256; v++){ acc += hist[v]; if(acc >= tl){ lo = v; break; } }
  var hi = 255; acc = 0;
  for(v = 255; v >= 0; v--){ acc += hist[v]; if(acc >= tl){ hi = v; break; } }
  return [lo, hi];
}

/* 灰度铺成 jsQR 要的 RGBA: binarize() 首行做长度校验, 必须 w*h*4 四通道 */
function qrPack(g, n, lo, hi, out){
  var span = hi - lo;
  if(span < 1) span = 1;
  for(var i = 0; i < n; i++){
    var q = Math.round((g[i] - lo) * 255 / span);
    if(q < 0) q = 0; else if(q > 255) q = 255;
    var o = i * 4;
    out[o] = q; out[o + 1] = q; out[o + 2] = q; out[o + 3] = 255;
  }
  return out;
}

/* 解码核心: 先按原图试一次(黑白码一次就中), 再按 通道 x 分位 多轮试.
   实测蓝色底纹的饮水机码单靠 rg + 2/98 解不出来, 必须多策略. */
function qrCore(data, w, h, fast){
  if(!qrReady()) return null;
  var n = w * h;
  var r = window.jsQR(data, w, h, { inversionAttempts: 'attemptBoth' });
  if(r && r.data) return r.data;

  var modes = fast ? ['rg', 'lum'] : ['rg', 'lum', 'grn'];
  var passes = fast ? [[0.02, 0.98], [0.10, 0.90]]
                    : [[0.02, 0.98], [0.05, 0.95], [0.10, 0.90], [0.20, 0.80], [0.30, 0.70]];
  var g = new Uint8Array(n);
  var buf = new Uint8ClampedArray(n * 4);
  for(var mi = 0; mi < modes.length; mi++){
    qrGray(data, n, modes[mi], g);
    for(var pi = 0; pi < passes.length; pi++){
      var rr = qrRange(g, n, passes[pi][0], passes[pi][1]);
      if(rr[1] - rr[0] < 8){ continue; }
      qrPack(g, n, rr[0], rr[1], buf);
      var hit = window.jsQR(buf, w, h, { inversionAttempts: 'dontInvert' });
      if(hit && hit.data) return hit.data;
    }
  }
  return null;
}
function qrDecode(src, w, h){
  if(!qrReady()) return null;
  var cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  var cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(src, 0, 0, w, h);
  var img = cx.getImageData(0, 0, w, h);
  return qrCore(img.data, w, h, false);
}
/* 实时扫: 打开后置相机, 每帧抽一次. iOS 必须用户手势触发, 所以入口都是按钮 */
function webScanStart(cb){
  if(!qrReady()){ alertBox('扫码组件没加载', '页面里的解码器没有就绪.'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alertBox('这个浏览器不支持相机', '可以点"相册"选一张二维码图片, 或直接粘贴设备码.',
      [{ label:'选图片', cls:'btn-b', fn:function(){ webPickFile(cb); } }, { label:'取消' }]);
    return;
  }
  WEBQR.cb = cb;
  var ov = document.createElement('div');
  ov.id = 'webCam';
  ov.innerHTML = '<div class="wc-box">'
    + '<video id="wcV" playsinline webkit-playsinline muted autoplay></video>'
    + '<div class="wc-tip">把机器上的码放进框里</div>'
    + '<div class="wc-row"><button class="btn-f" id="wcCancel">取消</button>'
    + '<button class="btn-b btn-f" id="wcPick">从相册选</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  $('wcCancel').onclick = function(){ webScanStop(); };
  $('wcPick').onclick = function(){ webScanStop(); webPickFile(cb); };

  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(function(st){
    WEBQR.stream = st;
    var v = $('wcV');
    WEBQR.video = v;
    v.srcObject = st;
    return v.play();
  }).then(function(){
    WEBQR.running = true;
    webScanTick();
  }).catch(function(e){
    webScanStop();
    var msg = String(e && e.name || e);
    if(msg === 'NotAllowedError'){
      alertBox('相机没给用', '在浏览器设置里允许本站使用相机, 再点一次.<br>iPhone: 设置 - Safari - 相机.');
    }else if(msg === 'NotFoundError'){
      alertBox('没找到相机', '可以点"相册"选一张二维码图片.');
    }else{
      alertBox('相机没起来', esc(msg));
    }
  });
}

function webScanTick(){
  if(!WEBQR.running) return;
  var v = WEBQR.video;
  if(v && v.readyState >= 2 && v.videoWidth){
    var w = v.videoWidth, h = v.videoHeight;
    /* 只解中间那块, 手机整帧太大且码通常在中部 */
    var side = Math.min(w, h);
    var sx = (w - side) / 2, sy = (h - side) / 2;
    var txt = qrDecodeRect(v, sx, sy, side, side);
    if(txt){
      var cb = WEBQR.cb;
      webScanStop();
      if(cb) cb(txt);
      return;
    }
  }
  WEBQR.raf = requestAnimationFrame(function(){
    /* 隔帧解, 省电也够快 */
    setTimeout(webScanTick, 60);
  });
}

function qrDecodeRect(src, sx, sy, sw, sh){
  if(!qrReady()) return null;
  var S = 720;
  if(!WEBQR.canvas){
    WEBQR.canvas = document.createElement('canvas');
    WEBQR.canvas.width = S; WEBQR.canvas.height = S;
    WEBQR.ctx = WEBQR.canvas.getContext('2d', { willReadFrequently: true });
  }
  var cx = WEBQR.ctx;
  cx.drawImage(src, sx, sy, sw, sh, 0, 0, S, S);
  var img = cx.getImageData(0, 0, S, S);
  return qrCore(img.data, S, S, true);
}
function webScanStop(){
  WEBQR.running = false;
  if(WEBQR.raf) { cancelAnimationFrame(WEBQR.raf); WEBQR.raf = 0; }
  if(WEBQR.stream){
    try{ WEBQR.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    WEBQR.stream = null;
  }
  WEBQR.video = null;
  var ov = $('webCam');
  if(ov && ov.parentNode){ ov.parentNode.removeChild(ov); }
}

/* 相册选图解码 */
function webPickFile(cb){
  if(!qrReady()){ alertBox('解码器没加载', '页面里的 jsQR 没有就绪.'); return; }
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    setTimeout(function(){ if(inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        /* 大图先缩到 1400, 太慢; 小的直接解 */
        var mx = 1400;
        var w = im.width, h = im.height;
        if(Math.max(w, h) > mx){
          var k = mx / Math.max(w, h);
          w = Math.round(w * k); h = Math.round(h * k);
        }
        var txt = qrDecode(im, w, h);
        if(!txt){
          /* 原尺寸再试一次, 有些小码缩放后丢模块 */
          txt = qrDecode(im, im.width, im.height);
        }
        if(txt){ if(cb) cb(txt); }
        else{ alertBox('这张图里没认出二维码', '换一张更清晰的, 或者直接输入设备码.'); }
      };
      im.onerror = function(){ alertBox('这张图打不开', '换个格式试试.'); };
      im.src = fr.result;
    };
    fr.onerror = function(){ alertBox('读文件失败', '换个文件试试.'); };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* 浏览器定位 */
function webLocate(cb){
  if(!navigator.geolocation){
    cb({ ok:false, err:'这个浏览器不给定位' });
    return;
  }
  navigator.geolocation.getCurrentPosition(function(p){
    cb({ ok:true, lat:p.coords.latitude, lng:p.coords.longitude,
         acc:p.coords.accuracy || 0, cached:false });
  }, function(e){
    var m = '定位失败';
    if(e && e.code === 1) m = '定位权限被拒, 在浏览器设置里允许本站读取位置';
    else if(e && e.code === 2) m = '拿不到位置信号';
    else if(e && e.code === 3) m = '定位超时';
    cb({ ok:false, err:m });
  }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
}

/* 浏览器权限真实状态 */
function webPermState(){
  var cam = false, loc = false, noti = false;
  try{
    if(navigator.permissions && navigator.permissions.query){
      /* 只能异步查, 这里用缓存值, 真值由 webRefreshPerms 更新 */
      cam = !!WEBPERM.camera; loc = !!WEBPERM.location; noti = !!WEBPERM.notification;
    }
  }catch(e){}
  return { camera:cam, location:loc, notification:noti,
           exactAlarm:false, install:false, sdk:0, web:true };
}
var WEBPERM = { camera:false, location:false, notification:false };
function webRefreshPerms(done){
  if(!(navigator.permissions && navigator.permissions.query)){ if(done) done(); return; }
  var names = [['camera','camera'],['geolocation','location'],['notifications','notification']];
  var left = names.length;
  names.forEach(function(p){
    var settled = false;
    function fin(state){
      if(settled) return; settled = true;
      if(state === 'granted'){ WEBPERM[p[1]] = true; }
      else if(state === 'denied'){ WEBPERM[p[1]] = false; WEBPERM[p[1] + 'Known'] = true; }
      /* prompt 或查询不支持: 保持未知, 不谎报"未授权" */
      if(--left === 0 && done) done();
    }
    try{
      var q = navigator.permissions.query({ name:p[0] });
      if(q && typeof q.then === 'function'){
        q.then(function(st){ fin(st && st.state); })
         .catch(function(){ fin(null); });
      }else{ fin(null); }
    }catch(e){ fin(null); }
  });
}

/* 提醒: 网页没有系统闹钟, 用通知 + 页面定时器 */
function webNotify(title, body){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted'){
    try{ new Notification(title, { body:body, tag:'hz-wash' }); return true; }catch(e){}
  }
  return false;
}
function webAskNotify(cb){
  if(!('Notification' in window)){ if(cb) cb(false); return; }
  if(Notification.permission === 'granted'){ if(cb) cb(true); return; }
  notifyAsk(function(p){ if(cb) cb(p === 'granted'); });
}

/* 老 Safari 的 requestPermission 只吃回调, 新版才返回 Promise. 两种都兜住. */
function notifyAsk(cb){
  var done = false;
  function fin(p){ if(done) return; done = true; if(cb) cb(p); }
  try{
    var r = Notification.requestPermission(fin);
    if(r && typeof r.then === 'function'){
      r.then(fin).catch(function(){ fin(Notification.permission); });
    }
  }catch(e){ fin(Notification.permission || 'default'); }
}

/* 从系统设置页返回时, 把挂起的"已下载包"续上安装. 只对原生有效. */
if(HASNATIVE){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    var rid = window.__hzPendingInstall;
    if(!rid) return;
    window.__hzPendingInstall = null;
    if(!window.HzNative.installReady) return;
    try{ window.HzNative.installReady(rid); }
    catch(e){ log('续装失败: ' + e.message, 'w'); }
  });
}


/* ---------------------------------------------------------------
   服务器时钟偏差(只用于两件事, 不当"时间基准"用来算到点时刻).

   为什么不能直接拿服务器时间算到点: AlarmManager 和厂商时钟 App 都按手机自己的
   时钟读数走. 手机慢一小时, 闹钟就跟着晚一小时 -- 把服务器时刻直接传下去只会
   额外再晚一个偏差. 所以到点时刻必须落在"设备时钟坐标系"里:

     remain(纯时长)      -> Date.now() + N 秒       设备秒速准, 免疫读数偏差
     washEndTime(服务器) -> 减 skew 转成设备坐标系

   skew 因此只剩两个用途: ① 上面的坐标转换; ② 界面告警"手机比服务器慢 N 秒".
   Date 头只到秒, 精度 1 秒; 单次跳动超 30 分钟视为中间层改写, 不采信.
   --------------------------------------------------------------- */
var SRV_SKEW = 0;          /* 服务端时刻 - 本机时刻, 毫秒 */
var SRV_SKEW_AT = 0;       /* 上次校正的本机时刻 */
var SRV_SKEW_OK = false;   /* 有没有成功校正过 */

function srvSkewFrom(dateMs){
  var d = Number(dateMs);
  if(!isFinite(d) || d <= 0) return;
  var diff = d - Date.now();
  /* 手机时间被手动改过时会跳很大; 但服务端 Date 是从响应生成到收到的真实时刻,
     正常情况 |diff| 在几十毫秒到几秒. 超过 30 分钟多半是 Date 头被中间层改写,
     这种就不采信, 免得把对的时钟带偏. */
  if(Math.abs(diff) > 30 * 60 * 1000) return;
  SRV_SKEW = diff;
  SRV_SKEW_AT = Date.now();
  SRV_SKEW_OK = true;
}

function nreq(method, url, headers, body){
  headers = headers || {};
  if(HASNATIVE){
    return new Promise(function(resolve){
      var id = 'r' + (++cbSeq);
      window.__hzCb[id] = function(r){
        delete window.__hzCb[id];
        if(r && r.ok){
          if(r.date) srvSkewFrom(r.date);
          resolve({ status: r.status, text: r.text || '' });
        }
        else resolve({ status: 0, text: '', err: (r && r.err) || 'native fail' });
      };
      try{ window.HzNative.http(id, method, url, JSON.stringify(headers), body || ''); }
      catch(e){ delete window.__hzCb[id]; resolve({ status: 0, text: '', err: String(e) }); }
    });
  }
  var opt = { method: method, headers: headers };
  if(body) opt.body = body;
  return fetch(url, opt).then(function(r){
    try{ var dh = r.headers.get('date'); if(dh) srvSkewFrom(Date.parse(dh)); }catch(e){}
    return r.text().then(function(t){ return { status: r.status, text: t }; });
  }).catch(function(e){ return { status: 0, text: '', err: String(e) }; });
}

function openUrl(url){
  if(!url){ toast('没有可打开的链接'); return; }
  if(HASNATIVE && window.HzNative.openUrl){
    try{ window.HzNative.openUrl(url); return; }catch(e){}
  }
  window.open(url, '_blank');
}

/* 纯 JS SHA-256 */
var SHA = (function(){
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  function rotr(x,n){ return (x>>>n)|(x<<(32-n)); }
  function utf8(s){
    var out=[],i,c;
    for(i=0;i<s.length;i++){
      c=s.charCodeAt(i);
      if(c<0x80) out.push(c);
      else if(c<0x800){ out.push(0xc0|(c>>6),0x80|(c&63)); }
      else if(c>=0xd800&&c<=0xdbff&&i+1<s.length){
        var c2=s.charCodeAt(i+1);
        if(c2>=0xdc00&&c2<=0xdfff){
          var cp=0x10000+((c-0xd800)<<10)+(c2-0xdc00);
          out.push(0xf0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63));
          i++;
        }else{ out.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
      }
      else{ out.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
    }
    return out;
  }
  return function(str){
    var bytes=utf8(str), l=bytes.length, bl=l*8, i, j;
    bytes.push(0x80);
    while(bytes.length%64!==56) bytes.push(0);
    bytes.push(0,0,0,0,(bl>>>24)&255,(bl>>>16)&255,(bl>>>8)&255,bl&255);
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var w=new Array(64);
    for(j=0;j<bytes.length;j+=64){
      for(i=0;i<16;i++) w[i]=(bytes[j+i*4]<<24)|(bytes[j+i*4+1]<<16)|(bytes[j+i*4+2]<<8)|bytes[j+i*4+3];
      for(i=16;i<64;i++){
        var s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
        var s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(i=0;i<64;i++){
        var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
        var ch=(e&f)^(~e&g);
        var t1=(h+S1+ch+K[i]+w[i])|0;
        var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
        var mj=(a&b)^(a&c)^(b&c);
        var t2=(S0+mj)|0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }
    var hex='';
    for(i=0;i<8;i++) hex+=('00000000'+(H[i]>>>0).toString(16)).slice(-8);
    return hex;
  };
})();

   1. 账号库 (多账号 + 持久化)
   ============================================================ */
var ACC_KEY = 'hz_acc_v5';

/* ===== 关键状态的原生副本 =====
 * 为什么: localStorage 落在 /data/data/com.hz.water 内, adb uninstall 或系统
 * "清除数据"会连同目录一起删掉. 登录态一旦丢, 用户要再花一次短信验证码额度
 * (每日按手机号计数), 所以把这几项同时写一份到原生 SharedPreferences.
 * 白名单在壳侧 PrefStore.KEYS: hz_acc_v5 / hz_terms_v6 / hz_alarms_v6.
 */
function mirPut(key, val){
  try{
    if(HASNATIVE && window.HzNative.mirror) window.HzNative.mirror(key, String(val == null ? '' : val));
  }catch(e){}
}
function mirGet(key){
  try{
    if(HASNATIVE && window.HzNative.mirrorGet) return String(window.HzNative.mirrorGet(key) || '');
  }catch(e){}
  return '';
}
function mirClear(key){
  try{ if(HASNATIVE && window.HzNative.mirrorClear) window.HzNative.mirrorClear(key); }catch(e){}
}

/* ===== 公共目录备份 =====
 * 落点 Downloads/hz-water-backup.json, 卸载重装不删. 这是丢了也不用重新发码的最后一层.
 * 写入节流: accSave/termsSave/alSave 都会触发, 但真正落盘最多 3 秒一次, 且内容没变就跳过.
 */
var DUMP_LAST = '';
var DUMP_TIMER = null;
function dumpBody(){
  var o = {};
  o[ACC_KEY] = JSON.stringify(ACC);
  o[TERMS_KEY] = JSON.stringify(TERMS);
  o[AL_KEY] = JSON.stringify(AL.list.slice(0, 12));
  return JSON.stringify(o);
}
function dumpFlush(){
  DUMP_TIMER = null;
  if(!HASNATIVE || !window.HzNative.dumpWrite) return;
  if(MIR_BUSY) return;
  var body = '';
  try{ body = dumpBody(); }catch(e){ return; }
  if(body === DUMP_LAST) return;
  /* 账号库从有到无时拒绝覆盖: 那份备份可能是用户唯一的登录态凭证 */
  try{
    if(DUMP_LAST && (ACC.water||[]).length === 0 && (ACC.laundry||[]).length === 0){
      var old = JSON.parse(DUMP_LAST) || {};
      var oa = JSON.parse(old[ACC_KEY] || '{}') || {};
      if(((oa.water && oa.water.length) || 0) + ((oa.laundry && oa.laundry.length) || 0) > 0){
        log('账号已清空, 保留旧备份不覆盖', 'w');
        return;
      }
    }
  }catch(e){}
  try{ if(window.HzNative.dumpWrite(body)) DUMP_LAST = body; }catch(e){}
}/* 当前备份走哪条路: file(有全文件权限, 跨卸载可读) / media(仅本次安装内有效) */
function dumpModeNow(){
  try{
    if(HASNATIVE && window.HzNative.dumpMode) return String(window.HzNative.dumpMode() || 'media');
  }catch(e){}
  return 'media';
}

function dumpSoon(){
  if(!HASNATIVE || !window.HzNative.dumpWrite) return;
  if(MIR_BUSY) return;   /* 回填进行中, 不拿半成品覆盖备份 */
  if(DUMP_TIMER) return;
  DUMP_TIMER = setTimeout(dumpFlush, 3000);
}

/* 判断一份本地值算不算"有内容". 空账号/未同意协议/空提醒列表都算空,
 * 这样即使页面在 mirRestore 之前已经写过一次空快照, 也仍然允许被备份覆盖. */
function mirEmpty(key, raw){
  if(raw == null) return true;
  var t = String(raw);
  if(t.length < 2) return true;
  var o = null;
  try{ o = JSON.parse(t); }catch(e){ return false; }
  if(!o || typeof o !== 'object') return false;
  if(key === ACC_KEY){
    var w = (o.water && o.water.length) || 0;
    var l = (o.laundry && o.laundry.length) || 0;
    return (w + l) === 0;
  }
  if(key === TERMS_KEY) return !Number(o.agreed || 0);
  if(key === AL_KEY){
    return !(o && o.length);
  }
  return false;
}
var MIR_BUSY = false;

/* 启动时调用: localStorage 缺哪个 key 就用原生副本补回去.
 * 只在本地为空时补, 本地有值一律以本地为准 -- 否则用户刚清过数据又被原生填回来. */
function mirRestore(){
  if(!HASNATIVE || !window.HzNative.mirrorAll) return 0;
  var all = null;
  try{ all = JSON.parse(window.HzNative.mirrorAll() || '{}'); }catch(e){ return 0; }
  if(!all || typeof all !== 'object') return 0;
  /* 第二层: 原生副本也空(通常是卸载重装过), 去公共目录的备份文件里找 */
  var need = false;
  for(var q=0;q<3;q++){
    var kk = [ACC_KEY, TERMS_KEY, AL_KEY][q];
    if(!all[kk]){ need = true; break; }
  }
  if(need && window.HzNative.dumpRead){
    var raw = '';
    try{ raw = String(window.HzNative.dumpRead() || ''); }catch(e){ raw = ''; }
    if(raw.length > 2){
      var dj = null;
      try{ dj = JSON.parse(raw); }catch(e){ dj = null; }
      if(dj && typeof dj === 'object'){
        for(var j=0;j<3;j++){
          var kj = [ACC_KEY, TERMS_KEY, AL_KEY][j];
          if(!all[kj] && dj[kj]) all[kj] = dj[kj];
        }
        log('发现公共目录备份, 正在用于回填', 's');
      }
    }
  }
  var keys = [ACC_KEY, TERMS_KEY, AL_KEY];
  var n = 0;
  MIR_BUSY = true;   /* 回填期间禁止 dump 回写, 否则会把备份覆盖成刚读到的空快照 */
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var v = all[k];
    if(!v) continue;
    var cur = '';
    try{ cur = localStorage.getItem(k) || ''; }catch(e){ continue; }
    /* 本地已有"有内容"的数据就不动它; 只是空快照则允许被备份覆盖 */
    if(cur && cur.length > 2 && !mirEmpty(k, cur)) continue;
    try{ localStorage.setItem(k, String(v)); n++; }catch(e){}
  }
  if(n) log('从原生副本回填了 ' + n + ' 项本地状态', 's');
  MIR_BUSY = false;
  try{ DUMP_LAST = dumpBody(); }catch(e){}   /* 重置基线: 回填后的状态就是最新, 不必再写一次 */
  return n;
}
/* Safari 无痕模式下 setItem 会抛, 探一次让界面能如实提示 */
var STORE_OK = (function(){

var ACC = { water:[], laundry:[], curWater:null, curLaundry:null, theme:'light' };

function accLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(ACC_KEY) || '{}');
    if(Array.isArray(o.water)) ACC.water = o.water;
    if(Array.isArray(o.laundry)) ACC.laundry = o.laundry;
    if(o.curWater) ACC.curWater = o.curWater;
    if(o.curLaundry) ACC.curLaundry = o.curLaundry;
    if(o.theme) ACC.theme = o.theme;
    // 一次性迁移: v7 起默认改浅色. 老数据没 themeVer, 说明 theme 还是旧版默认值,
    // 不是用户主动选的, 直接改成 light 并打上 themeVer. 之后用户自己切主题会覆盖.
    if(o.themeVer !== 2){
      if(!o.theme || o.theme === 'dark'){ ACC.theme = 'light'; }
      ACC.themeVer = 2;
    }else{
      ACC.themeVer = 2;
    }
  }catch(e){}
}
function accSave(){
  var js = JSON.stringify(ACC);
  try{ localStorage.setItem(ACC_KEY, js); }catch(e){}
  mirPut(ACC_KEY, js);
  dumpSoon();
}
function accFind(kind, phone){
  var arr = ACC[kind] || [];
  for(var i=0;i<arr.length;i++) if(arr[i].phone === phone) return arr[i];
  return null;
}
function accUpsert(kind, entry){
  entry.ts = Date.now();
  var arr = ACC[kind] = ACC[kind] || [];
  var hit = false;
  for(var i=0;i<arr.length;i++){
    if(arr[i].phone === entry.phone){
      arr[i].token = entry.token;
      if(entry.userId) arr[i].userId = entry.userId;
      arr[i].ts = entry.ts;
      hit = true;
      break;
    }
  }
  if(!hit) arr.unshift(entry);
  if(arr.length > 8) arr.length = 8;
  if(kind === 'water') ACC.curWater = entry.phone;
  else ACC.curLaundry = entry.phone;
  accSave();
}
function accDel(kind, phone){
  var arr = ACC[kind] || [];
  for(var i=0;i<arr.length;i++){
    if(arr[i].phone === phone){ arr.splice(i,1); break; }
  }
  if(kind === 'water' && ACC.curWater === phone) ACC.curWater = null;
  if(kind === 'laundry' && ACC.curLaundry === phone) ACC.curLaundry = null;
  accSave();
}
function accClear(){
  ACC.water = []; ACC.laundry = [];
  ACC.curWater = null; ACC.curLaundry = null;
  accSave();
  mirClear(ACC_KEY);   /* 用户主动清号时, 原生副本也要一起清, 否则下次启动又被回填 */
}

var APPS = [];
var CUR = null;
var PAGE_STACK = [];

function registerApp(app){
  app.pages = app.pages || {};
  APPS.push(app);
}
function enterApp(id){ CUR = id; PAGE_STACK = []; paint(); }
function pushPage(page){ PAGE_STACK.push(page); paint(); }
function popPage(){ if(PAGE_STACK.length){ PAGE_STACK.pop(); paint(); } }
function curApp(){
  for(var i=0;i<APPS.length;i++) if(APPS[i].id===CUR) return APPS[i];
  return null;
}
function curPage(){ return PAGE_STACK.length ? PAGE_STACK[PAGE_STACK.length-1] : null; }

var LAST_KEY = '';
function paint(){
  var app = curApp(); if(!app) return;
  var page = curPage();
  var key = CUR + '|' + (page ? (page.title || '') : '');
  var keepTop = (key === LAST_KEY) ? $('body').scrollTop : 0;
  LAST_KEY = key;
  $('hdTitle').textContent = page ? (page.title || app.name) : app.name;
  $('hdSub').textContent = page ? (page.sub || '') : (app.sub || '');
  $('hdBack').className = 'hd-back' + (PAGE_STACK.length ? '' : ' hide');
  var host = $('body');
  host.innerHTML = '';
  try{
    if(page) page.render(host);
    else app.home(host);
  }catch(e){
    host.innerHTML = '<div class="card"><h2>渲染失败</h2><div class="sub">'
      + esc(e && e.message) + '</div></div>';
  }
  host.scrollTop = keepTop;
  renderNav();
  if(HASNATIVE && window.HzNative.setDepth){
    try{ window.HzNative.setDepth(PAGE_STACK.length); }catch(e){}
  }
}
function renderNav(){
  var el = $('nav');
  el.innerHTML = APPS.map(function(a){
    return '<div class="nav-i'+(a.id===CUR?' on':'')+'" data-app="'+a.id+'">'
      + '<span class="ic">'+a.icon+'</span>'+esc(a.name)+'</div>';
  }).join('');
  Array.prototype.forEach.call(el.children, function(c){
    c.onclick = function(){ enterApp(c.getAttribute('data-app')); };

}
function kv(label, val, cls){

/* 需要内联加粗/删除线时用 kvH: label 仍转义, html 原样插入(调用方必须先 esc 掉用户数据) */
function kvH(label, html, cls){
  return '<div class="kv"><span>'+esc(label)+'</span><b class="'+(cls||'')+'">'+(html||'')+'</b></div>';
}
function badge(txt, cls){ return '<span class="pill '+(cls||'')+'">'+esc(txt)+'</span>'; }

/* 验证码倒计时 */
var CD = {};
var CD_SEC = 60;
function startCd(key, btn, label){
  if(CD[key] && CD[key].left > 0) return false;
  CD[key] = { left: CD_SEC };
  btn.disabled = true;
  btn.textContent = CD_SEC + 's';
  CD[key].timer = setInterval(function(){
    if(!CD[key]) return;
    CD[key].left--;
    if(CD[key].left <= 0){
      clearInterval(CD[key].timer);
      CD[key] = null;
      btn.disabled = false;
      btn.textContent = label;
      return;
    }
    btn.textContent = CD[key].left + 's';
  }, 1000);
  return true;
}

function qs(obj){
  var parts = [], k;
  for(k in obj){
    if(obj[k]===null || obj[k]===undefined) continue;
    parts.push(encodeURIComponent(k)+'='+encodeURIComponent(obj[k]));
  }
  return parts.join('&');
}
function apiForm(path, data){
  var body = {}, k;
  for(k in (data||{})) body[k] = data[k];
  if(S.token) body.token = S.token;
  body.distributorType = body.distributorType || DIST;
  body.scanType = body.scanType || SCAN_T;
  /* scan 一类接口的参数必须放在 reqMap[xxx] 里, 顶层只放 token/distributorType/scanType.
     直接传 imei 服务端读不到, 会报 code:1 经销商类型不能为空(model: 官方包 Ns() 就是这么包的). */
  if(body.reqMap && typeof body.reqMap === 'object'){
    var rm = body.reqMap; delete body.reqMap;
    for(k in rm) body['reqMap[' + k + ']'] = rm[k];
  }
  if(body.reqFields && typeof body.reqFields === 'object'){
    var rf = body.reqFields; delete body.reqFields;
    for(k in rf) body['reqMap[' + k + ']'] = rf[k];
  }
  return nreq('POST', BASE+path, {
    'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'
  }, qs(body)).then(function(r){
    if(!r.status) throw new Error(r.err || 'network');
    var j = jparse(r.text);
    if(!j) throw new Error('HTTP '+r.status+' 非 JSON');
    if(j.code===2 && String(j.msg||'').indexOf('未登录')>=0) sessionDead();
    return j;
  });
}
/* 裸表单: 发码专用, 不带 token 与扫描参数 */
function bareForm(path, data){
  return nreq('POST', BASE+path, {
    'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'
  }, qs(data||{})).then(function(r){
    if(!r.status) throw new Error(r.err || 'network');
    var j = jparse(r.text);
    if(!j) throw new Error('HTTP '+r.status+' 非 JSON');
    return j;
  });
}

/* 从扫码内容或手输里取设备码.
   旧版只认 32 位十六进制, 用户手输机器编号就被判成不是二维码, 这是错的:
   设备码的形式由服务端定, 本地只负责原样送上去. */
/* 机身贴纸印的是 02-0041683 这种短码. 它在服务端不叫 imei, 对应的是
   deviceInfo.macAddress 的后 7 位 (macAddress=0QHJM0041683 -> 02-0041683).
   实测 '02-' + mac.slice(-7) === 贴纸码. 服务端没有"按贴纸码找机器"的接口,
   所以只能扫到机器后回显贴纸码, 反向只能靠用户已经扫过的记录. */
function pressToMac(press){
  var m = String(press || '').replace(/\s/g, '').match(/^0?2-?([0-9A-Za-z]{7})$/);
  return m ? m[1] : null;
}
function macToPress(mac){
  var m = String(mac || '').replace(/\s/g, '');
  if(m.length < 7) return null;
  return '02-' + m.slice(-7);
}
function pickCode(raw){
  if(raw === undefined || raw === null) return null;
  var t = String(raw).trim();
  if(!t) return null;
  var m = t.match(/(?:imei|uuid|deviceId|deviceCode|code|id)=([0-9A-Za-z_-]{4,64})/i);
  if(m) return m[1];
  m = t.match(/[0-9A-Fa-f]{32}/);
  if(m) return m[0].toUpperCase();
  var only = t.replace(/[ \t\r\n]+/g, '');
  if(/^[0-9A-Za-z_-]{4,64}$/.test(only)) return only;
  return t;
}
function pickImei(raw){ return pickCode(raw); }

async function wResolve(){
  wStopPoll(); /* 换设备前先停掉上一台的轮询, 避免失败后残留 */
  var rawIn = String(($('wQrc') && $('wQrc').value) || '');
  var imei = pickCode(rawIn);
  if(!imei){
    alertBox('没认出设备码', '这一串里取不出设备码. 对着饮水机上的二维码重扫一次, 或者把整段内容原样贴进来.');
    return;
  }
  /* 机身贴纸印的 02-0041683 不是服务端认的 imei, 送过去必然 0003.
     与其让服务端报个看不懂的错, 不如这里先讲明白. */
  var pressOnly = pressToMac(imei);
  if(pressOnly && !/[0-9A-Fa-f]{32}/.test(imei)){
    alertBox('这是机身贴纸码',
      '<b>' + esc(imei) + '</b> 是机身上印的短码, 服务端只认完整二维码里的 32 位设备码.<br><br>'
      + '对着机器上那张二维码扫一次, 就能读到真正的设备号;<br>'
      + '扫到之后我会把它的贴纸码一起显示出来, 方便你核对是哪台.');
    return;
  }
  if(!S.token){
    alertBox('先登录', '读设备要先有胖乖登录态.', [{ label:'知道了' }]);
    return;
  }
  S.imei = imei;
  try{
    var j = await apiForm('distributor/scan', { reqMap:{ imei:imei } });
    if(j.code!==0 || !j.data){
      alertBox('读设备失败', 'code=' + j.code + '<br>' + esc(j.msg || ''));
      return;
    }
    var d = j.data;
    /* respCode 0000 才是成功; 0003 是设备不存在. code=0 不代表设备读到了. */
    if(d.respCode && d.respCode !== '0000'){
      var whyRc = (d.respCode === '0003') ? '服务端里没有这台设备 (respCode 0003)'
                : ('服务端回了 respCode ' + d.respCode);
      alertBox('设备不存在', esc(whyRc) + '<br><br>设备码 <b>' + esc(imei) + '</b> 查不到.<br>'
        + '确认码有没有抄错, 或者这台机器不是胖乖的.');
      return;
    }
    S.dev = d;
    S.bizToken = d.bizToken || d.token || null;
    if(d.accountInfo) S.accountId = d.accountInfo.accountId;
    /* areaInfo 实测是 undefined, 真正的电荷区在 accountInfo.areaId 或 accountShare 里. */
    /* 机器在哪个区: 只有 deviceInfo.merchantAreaId 是机器自己的区.
       accountInfo.areaId 是账号主区, 拿它当机器区会把'这台机器的区'标到别的卡上,
       同区校验也跟着错 -- 这就是'北区的钱被当成中区'的一半原因. */
    if(d.deviceInfo && d.deviceInfo.merchantAreaId){
      S.areaId = d.deviceInfo.merchantAreaId;
      S.areaName = d.deviceInfo.areaName || null;
    }else if(d.areaInfo && d.areaInfo.areaId){
      S.areaId = d.areaInfo.areaId;
      S.areaName = d.areaInfo.areaName || null;
    }else if(d.accountInfo && d.accountInfo.areaId){
      S.areaId = d.accountInfo.areaId;
      S.areaName = null;
    }
    if(d.deviceInfo) S.washerId = d.deviceInfo.washerId;
    /* 回显机身贴纸码, 让用户能核对扫的是不是眼前这台. */
    if(d.deviceInfo && d.deviceInfo.macAddress){
      S.press = macToPress(d.deviceInfo.macAddress);
      if(S.press) log('机身贴纸码 ' + S.press + ' 对应 macAddress ' + d.deviceInfo.macAddress, 's');
    }
    S.pw = d.passagewayList || d.passageways || d.waterPassageways || [];
    /* 默认通道: 优先可用(status!=2)里单价最低的那路, 而不是永远第 0 路. */
    SEL_PW = 0;
    var _best = -1, _bp = Infinity;
    S.pw.forEach(function(p, i){
      if(Number(p.status) === 2) return;
      var pr = Number(p.waterCharge);
      if(!(pr >= 0)) pr = Infinity;
      if(pr < _bp){ _bp = pr; _best = i; }
    });
    if(_best >= 0) SEL_PW = _best;
    /* 多卡余额: accountShare 是这个账号在多个水区的预付卡, 全部收下来, 由用户切换. */
    W.share = (d.accountShare && d.accountShare.length) ? d.accountShare : null;
    /* 取证: accountShare 与 getWaterAreaList 是两套数据, 字段名可能不同.
       把 key 与值原样打出来, 才能判明"1.08 到底挂在哪套数据的哪个区名下". */
    try{
      if(W.share && W.share.length){
        log('accountShare 字段: ' + Object.keys(W.share[0]).join(','), 's');
        W.share.forEach(function(c, ci){
          log('accountShare[' + ci + ']: ' + JSON.stringify(c).slice(0, 260), 's');
        });
      }else{
        log('accountShare 为空, 这台设备没有多区余额信息', 'w');
      }
      if(d.areaInfo) log('设备区 areaInfo: ' + JSON.stringify(d.areaInfo).slice(0, 200), 's');
    }catch(eSh){}
    W.waterInit = d.waterInit || null;
    W.isShare = !!(d.accountInfo && d.accountInfo.isShare === 1);
    /* 关键: 用区名把两套 id 接起来.
       accountShare 给的是出水用的数字 areaId + areaName;
       waterAreaList 给的是充值用的 hex MERCHANT_AREA_ID + WASHER_AREA_NAME.
       同名即同区. 绝不按列表位置配对 -- 顺序不一致就会把 A 区的钱记到 B 区. */
    wBindChargeIds();
    /* 扫完就该能直接出水, 不让用户先选卡.
       规则: 机器所在区优先(服务端按设备区校验), 其次余额最多的那张.
       手动点水卡仍可改选, 但默认一定已经落在能出水且有余额的那张上. */
    if(W.share && W.share.length){
      var auto0 = wAutoCard();
      if(auto0){
        W.curArea = auto0.areaId;
        var pk0 = String(auto0.areaId);
        W.share.forEach(function(c){ c.isChoose = (String(c.areaId) === pk0); });
        try{ localStorage.setItem('hz_wcur', pk0); }catch(e){}
        log('自动选中水卡 ' + (auto0.name || auto0.areaId)
            + ', 余额 ' + Number(auto0.total || 0).toFixed(2) + ' 元'
            + (S.areaId !== null && S.areaId !== undefined
               && String(auto0.chargeId) === String(S.areaId) ? ' (机器就在这个区)' : ''), 's');
      }else{
        W.curArea = null;
        W.share.forEach(function(c){ c.isChoose = false; });
        log('这张码关联 ' + W.share.length + ' 张水卡, 但都没有余额, 出水前要充值', 'w');
      }
    }
    log('设备: '+(d.shopName||d.sellerName||'-')+' / '
        +((d.deviceInfo&&d.deviceInfo.areaName)||d.areaName||'-')
        +' (机器区 '+(S.areaId===null||S.areaId===undefined?'-':S.areaId)+')', 's');
    log('余额 totalBalance='+(d.totalBalance||0)+' respCode='+(d.respCode||'-'));
    paint();
  }catch(e){ alertBox('读设备异常', esc(e.message)); }
}

function doScan(){
  window.__qrMode = 'water';
  if(!HASNATIVE){ webScanStart(function(txt){ window.__onQr(txt); }); return; }
  window.__hzCb['qr'] = function(x){ window.__onQr(x); };
  try{ window.HzNative.scanQr(); }catch(e){ alertBox('相机没起来', esc(e.message)); }
}
function pickFile(){
  window.__qrMode = 'water';
  if(!HASNATIVE){ webPickFile(function(txt){ window.__onQr(txt); }); return; }
  window.__hzCb['qr'] = function(x){ window.__onQr(x); };
  try{ window.HzNative.pickQr(); }catch(e){ alertBox('相册没起来', esc(e.message)); }
}
window.__onQr = function(res){
  window.__hzCb['qr'] = function(x){ window.__onQr(x); };
  /*
   * 原生回包是 {ok, text} 对象, 不是字符串.
   * 以前直接把 res 当字符串用, 输入框里就出现 [object Object].
   * 这里统一取出文本; 失败时把 err 讲清楚, 不要静默.
   */
  var txt = '', err = '';
  if(res === null || res === undefined){
    toast('扫码返回空'); return;
  }
  if(typeof res === 'object'){
    txt = (res.text === null || res.text === undefined) ? "" : String(res.text);
    err = (res.err === null || res.err === undefined) ? "" : String(res.err);
    if(res.ok === false && !txt){ toast(err || '扫码没解出结果'); return; }
  } else {
    txt = String(res);
  }
  txt = txt.replace(/^\s+|\s+$/g, '');
  if(!txt){ toast(err || '扫码返回空'); return; }
  log('扫码结果: ' + txt.slice(0, 120));
  var mode = window.__qrMode || 'water';
  if(mode === 'laundry'){
    if($('uQr')) $('uQr').value = txt;
    uScan();
    return;
  }
  var code = pickCode(txt);
  if(!code){
    alertBox('二维码不认识', '扫到的内容取不出设备码:<br>' + esc(txt.slice(0, 160)));
    return;
  }
  if($('wQrc')) $('wQrc').value = code;
  wResolve();
};

var W = { bal:null, astrict:null, integral:0, amount:'0.00', cumulate:'0.00',
          areas:null, areasErr:null, areasLoaded:false, areasOpen:false, detailOpen:false,
          share:null, waterInit:null, isShare:false, curArea:null,
          coin:0, shopCoin:false, lim:null, loaded:false, signed:'' };

/* 切换水卡: 只改本地选择, 出水时把 chargeAreaId 带上. 官方 App 也是这个做法(isChoose). */
/* 当前扣费卡. 两套数据都要看:
 *   W.areas(apwork 水区表, areaId = MERCHANT_AREA_ID) 才是界面上列的、带真实余额的那套,
 *           也是 chargeAreaId 的口径;
 *   W.share(扫码响应 accountShare) 只在共享余额模式下有, 是同一批水区的另一份快照.
 * 原来只在 W.share 里查, 而可点的卡片是 W.areas 渲染的 -> 点谁都查不到,
 * 于是退回 W.share[0], 余额就串到别的区去了(用户报的"北区被当中区").
 */
/* 区名归一化: 全角/半角空格与首尾空白不影响配对. */
function wAreaKey(n){
  return String(n === null || n === undefined ? '' : n).replace(/\s+/g, '').trim();
}

/* 把 accountShare 的数字 areaId 按区名绑到 W.areas 上, 存成 chargeId.
   出水只认 chargeId; 没有 chargeId 的卡不允许扣费(宁可不给用, 也不能扣错区). */
function wBindChargeIds(){
  var idx = {};
  (W.share || []).forEach(function(c){
    var k = wAreaKey(c.areaName);
    if(k && c.areaId !== null && c.areaId !== undefined) idx[k] = c.areaId;
  });
  var bound = 0;
  (W.areas || []).forEach(function(a){
    var k = wAreaKey(a.name);
    if(Object.prototype.hasOwnProperty.call(idx, k)){ a.chargeId = idx[k]; bound++; }
    else{ a.chargeId = null; }
  });
  if(W.areas && W.areas.length){
    log('水卡绑定 ' + bound + '/' + W.areas.length + ' 张(按区名配对 chargeAreaId)',
        bound === W.areas.length ? 's' : 'w');
    if(bound < W.areas.length){
      log('未绑定区名: ' + (W.areas || []).filter(function(a){ return !a.chargeId; })
          .map(function(a){ return a.name; }).join(' / '), 'w');
    }
  }
}

/* 判断水卡 a 是不是 wanted 指的那一张.
   wanted 有两种口径: 充值侧 hex MERCHANT_AREA_ID, 或出水侧数字 areaId/chargeId.
   两种都认 -- 只认一种的话, 高亮认一套 id, 扣费认另一套, 钱就从别的区扣走了. */
function wIsArea(a, wanted){
  if(!a || wanted === null || wanted === undefined) return false;
  var w = String(wanted);
  if(!w) return false;
  if(String(a.areaId) === w) return true;
  if(a.chargeId !== null && a.chargeId !== undefined && String(a.chargeId) === w) return true;
  return false;
}

/* 自动挑一张能出水的水卡.
   1) 机器所在区有余额 -> 用它(服务端按设备区校验, 这是唯一稳的路)
   2) 机器所在区没钱   -> 用余额最多的那张(用户要求: 哪个有钱用哪个)
   3) 都不够门槛       -> null, 由调用方提示去充值
   全程不问用户. */
function wAutoCard(){
  var lim = Number((W.waterInit && W.waterInit.balanceLimit) || 0.01);
  var ok = (W.areas || []).filter(function(c){ return Number(c.total || 0) >= lim; });
  if(!ok.length) return null;
  if(S.areaId !== null && S.areaId !== undefined){
    var same = ok.filter(function(c){
      return c.chargeId !== null && c.chargeId !== undefined
        && String(c.chargeId) === String(S.areaId);
    })[0];
    if(same) return same;
  }
  return ok.slice().sort(function(x, y){
    return Number(y.total || 0) - Number(x.total || 0);
  })[0];
}

function wCardOf(areaId){
  var want = String(areaId === null || areaId === undefined ? '' : areaId);
  if(!want) return null;
  var a = (W.areas || []).filter(function(x){ return wIsArea(x, want); })[0];
  if(a) return { areaId: a.areaId, chargeId: a.chargeId, name: a.name,
                 total: a.total, src: 'areas' };
  var b = (W.share || []).filter(function(x){ return String(x.areaId) === want; })[0];
  if(b) return { areaId: b.areaId, chargeId: b.areaId,
                 name: (b.areaName || String(b.areaId)),
                 total: Number(b.totalBalance || 0), src: 'share' };
  return null;
}

function wPickArea(areaId){
  /* 必须按字符串比: areaId 在服务端是数字, DOM 属性回来是字符串; 混用 === 恒 false,
     会让"选了中区却仍按北区扣费". */
  var want = String(areaId === null || areaId === undefined ? '' : areaId);
  var c = wCardOf(want);
  if(!c){
    log('选了不存在的水区号 ' + want + ', 忽略 (水区 ' + ((W.areas||[]).length) + ' 个)', 'e');
    toast('这张卡不在当前账号里, 换一张');
    return;
  }
  W.curArea = c.areaId;      /* 存回服务端原始类型, 不要存 DOM 字符串 */
  try{ localStorage.setItem('hz_wcur', want); }catch(e){}
  SEL_PW = 0; /* 换区后通道列表属于新区, 选择重置 */
  (W.share || []).forEach(function(x){ x.isChoose = (String(x.areaId) === want); });
  log('切到水卡 ' + (c.name || want) + ', 余额 ' + Number(c.total || 0).toFixed(2) + ' 元', 's');
  paint();
}

/* 水区余额: 走 apwork 那套 H5 接口, 不带 token 也不带扫码, 只要一个加密手机号. */
var APW = 'https://apwork.cn/ewash/apiLoginController/getWaterAreaList.json';

/* silent=true: 轮询里调用, 只更新数据不写日志.
   轮询 3 秒一次, 每次本来要打 4 行诊断, 一分钟 80 行, 会把 unlock 的
   请求/响应(排查服务端到底回了什么的关键)全冲掉. */
async function wLoadAreas(silent){
  if(!S.token){ W.areas = null; W.areasLoaded = false; return; }
  try{
    var e = await apiForm('user/encrypt/phone', {});
    if(!e || e.code !== 0 || !e.data){ W.areasErr = '拿不到加密手机号'; if(CUR==='water') paint(); return; }
    var r = await nreq('POST', APW,
      { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      'phone=' + encodeURIComponent(e.data));
    var j = jparse(r.text);
    if(!j || !j.waterAreaList){ W.areasErr = '水区接口没返回列表 (' + r.status + ')'; if(CUR==='water') paint(); return; }
    /* 诊断: 原样打印第一项的字段名与值, 用来核对 WASHER_AREA_NAME 与 AMOUNT
       的配对关系. 已经定案, 只在非静默模式下打印. */
    if(!silent) try{
      var it0 = (j.waterAreaList && j.waterAreaList[0]) || {};
      log('水区原始字段: ' + Object.keys(it0).join(','), 's');
      log('水区原始第1项: ' + JSON.stringify(it0), 's');
      var rawAll = JSON.stringify(j.waterAreaList || []);
      log('水区原始全部: ' + rawAll.slice(0, 1200), 's');
      if(j.balance !== undefined || j.amount !== undefined || j.totalAmount !== undefined){
        log('水区顶层余额字段: balance=' + j.balance + ' amount=' + j.amount
            + ' totalAmount=' + j.totalAmount + ' usable=' + j.usableAmount, 's');
      }
      if(j.data){
        log('水区 data 层: ' + JSON.stringify(j.data).slice(0, 600), 's');
      }
    }catch(eD){}
    W.areas = j.waterAreaList.map(function(x){
      var am = Number(x.AMOUNT || 0), gf = Number(x.GIFT_AMOUNT || 0);
      return { name: x.WASHER_AREA_NAME || '-', amount: am, gift: gf, total: am + gf,
               phone: x.FAULT_PHONE, refund: x.IS_REFUND_BALANCE === 1,
               areaId: x.MERCHANT_AREA_ID, merchantId: x.MERCHANT_ID };
    });
    W.areasErr = null; W.areasLoaded = true;
    /* areas 是刚 new 出来的对象, chargeId 必须重绑(幂等). */
    wBindChargeIds();
    var tot = 0; W.areas.forEach(function(a){ tot += a.total; });
    if(!silent) log('水区 ' + W.areas.length + ' 个, 合计 ' + tot.toFixed(2) + ' 元', 's');
    if(!silent) try{
      log('水区清单: ' + W.areas.map(function(a){
        return (a.name || '-') + ' 余额' + a.total.toFixed(2)
          + ' 扣费区' + (a.chargeId === null || a.chargeId === undefined ? '未绑定' : a.chargeId)
          + ' 充值id' + String(a.areaId || '').slice(0, 8);
      }).join(' | '), 's');
    }catch(eL){}
    if(CUR==='water') paint();
  }catch(err){
    W.areasErr = String(err && err.message || err);
    log('水区余额读取失败: ' + W.areasErr, 'e');
    if(CUR==='water') paint();
  }
}

async function wLoadBalance(){
  if(!S.token){ W.loaded=false; if(CUR==='water') paint(); return; }
  try{
    var b = await apiForm('user/balance', {});
    if(b.code===0 && b.data){
      W.bal = b.data.balance;
      W.integral = b.data.integral || 0;
      W.amount = b.data.integralAmount || '0.00';
      W.cumulate = b.data.cumulateAmount || '0.00';
      W.coin = b.data.tokenCoin || 0;
      W.shopCoin = !!b.data.shopTokenCoinSet;
      W.loaded = true;
    }
    var a = await apiForm('user/astrict/list', {});
    W.astrict = (a.code===0 && a.data && a.data.length) ? a.data : null;
    try{
      var l = await sreq('/userIntegral/limitRule', {});
      if(l.code===0) W.lim = l.data;
    }catch(e){}
    wLoadAreas();
    if(CUR==='water') paint();
  }catch(e){ log('余额读取异常: '+e.message, 'e'); }
}

var SEL_PW = 0;
/* 出水相位: idle 未出水 / starting 已开阀等起泵 / running 正在出水 / settling 正在结算 */
if(typeof S !== 'undefined' && S && S.phase === undefined) S.phase = 'idle';
async function wUnlock(){
  if(!S.token){ alertBox('先登录', '取水要先登录胖乖账号.'); return; }
  if(!S.dev){
    alertBox('先读设备', '还没读设备. 先扫饮水机上的二维码, 或粘贴设备码后点 "读取设备".');
    return;
  }
  /* 扣费卡自动决定, 全程不打断: 机器所在区优先, 其次余额最多的那张.
     只有全都不够门槛才提示充值 -- 那种情况真的没得选. */
  var lim9 = Number((W.waterInit && W.waterInit.balanceLimit) || 0.01);
  var auto9 = wAutoCard();
  var curCard = (W.curArea !== null && W.curArea !== undefined) ? wCardOf(W.curArea) : null;
  /* 当前那张不可用(没选/余额不够/不在列表里)就自动换成能用的那张. */
  if(!curCard || Number(curCard.total || 0) < lim9){
    if(auto9){
      W.curArea = auto9.areaId;
      try{ localStorage.setItem('hz_wcur', String(auto9.areaId)); }catch(e){}
      curCard = wCardOf(W.curArea);
      if(W.share) W.share.forEach(function(c){ c.isChoose = wIsArea(auto9, c.areaId); });
      log('自动切到能用的水卡 ' + (auto9.name || auto9.areaId)
          + ', 余额 ' + Number(auto9.total || 0).toFixed(2) + ' 元', 's');
      paint();
    }
  }
  var balDev = curCard ? Number(curCard.total || 0) : 0;
  if(!curCard || balDev < lim9){
    log('没有够门槛的水卡: ' + ((W.areas || []).map(function(c){
      return (c.name || '-') + '=' + Number(c.total || 0).toFixed(2);
    }).join(' | ') || '水区列表为空'), 'w');
    modal({ title: '余额不够出水',
      body: (W.areas && W.areas.length)
        ? ('这些水区都没到开阀门槛, 至少 ' + esc(String(lim9)) + ' 元:<br>'
           + (W.areas || []).map(function(c){
               return esc(c.name || String(c.areaId)) + ' <b>' + Number(c.total || 0).toFixed(2) + '</b> 元';
             }).join('<br>')
           + '<br><br>任意一个区充够就能直接出水, 不用再选卡.')
        : '还没读到水区余额, 先点上面的刷新按钮.',
      actions: [ { label: '去充值', cls: 'btn-p', fn: wRecharge }, { label: '知道了' } ] });
    return;
  }
  var pw = S.pw[SEL_PW];
  if(!pw){ alertBox('通道列表为空', '设备返回的通道列表是空的, 没法出水.'); return; }
  if(pw.status === 2){
    alertBox('通道占用中', '这个通道正在出水, 换一个通道再试.');
    return;
  }
  /* 区/通道必须同源: washerId 与通道属于扫码那台设备(S.areaId),
     chargeAreaId 是扣费水区. 两者不同区时服务端直接 code=1 参数不正确 --
     这就是"切了石河子的卡却扫了默认区的机器"报错的根因. 提前拦下说人话. */
  /* chargeAreaId 与 S.areaId 必须是同一个 id 空间(数字), 不是 hex MERCHANT_AREA_ID.
     但只有"存在多个候选区"时才必须拿到 chargeId: 单卡账号没有选错的可能,
     硬闸只会把唯一能用的卡也挡掉. 判据见 need = 候选数 > 1. */
  var need2 = Number((W.waterInit && W.waterInit.balanceLimit) || 0.01);
  var candCount = 0;
  if(W.share && W.share.length){
    candCount = W.share.length;
  }else if(W.areas && W.areas.length){
    candCount = W.areas.filter(function(c){ return Number(c.total || 0) >= need2; }).length;
  }
  var multiArea = candCount > 1;
  var chargeArea = curCard && curCard.chargeId !== undefined && curCard.chargeId !== null
    ? curCard.chargeId : null;
  if(!chargeArea && !multiArea && S.areaId){
    /* 单区: 没有第二张卡可串, 直接用机器所在区, 与服务端校验口径一致. */
    chargeArea = S.areaId;
    log('单水区账号, 扣费区直接用机器区 ' + chargeArea, 's');
  }
  if(!chargeArea && S.areaId){
    chargeArea = S.areaId;
    log('水卡没绑上扣费区号, 先用机器区 ' + chargeArea + ' 试', 'w');
  }
  if(!chargeArea){
    /* 连机器区都没有 = 设备没读成功, 这才是真的没法出水. */
    alertBox('还没读到设备', '先扫一下饮水机上的码, 或粘贴设备码后点"读取".');
    return;
  }
  /* 不再本地拦"卡和机器不同区": 卡是自动选的, 拦下来只会让用户卡死在弹窗上.
     直接把请求发出去, 服务端会回具体原因(哪个区不支持/余额不足), 那比本地猜更准. */
  if(S.areaId && String(chargeArea) !== String(S.areaId)){
    log('注意: 扣费区 ' + chargeArea + ' 与机器区 ' + S.areaId + ' 不同, 交由服务端判定', 'w');
  }
  /* 官方 V={..., token: m.token, ...}: m 是 scan 响应对象, 这里的 token 是
     scan 下发的 awToken -- 且官方每次出水前都重新 scan(U() 链), awToken 是
     一次性的, 旧的会失效. 所以这里强制现扫一次拿新 token. */
  try{
    var rs = await apiForm('distributor/scan', { reqMap: { imei: S.imei, NQT: '' } });
    log('re-scan: ' + String(JSON.stringify(rs)).slice(0, 400), 'w');
    if(rs.code === 0 && rs.data){
      var rd = rs.data.result || rs.data;
      if(rd.token){ S.bizToken = rd.token; }
      if(rd.accountInfo && rd.accountInfo.accountId){ S.accountId = rd.accountInfo.accountId; }
      if(rd.deviceInfo && rd.deviceInfo.washerId){ S.washerId = rd.deviceInfo.washerId; }
      if(rd.deviceInfo && rd.deviceInfo.merchantAreaId){
        S.areaId = rd.deviceInfo.merchantAreaId;
        S.areaName = rd.deviceInfo.areaName || S.areaName || null;
      }else if(rd.areaInfo && rd.areaInfo.areaId){ S.areaId = rd.areaInfo.areaId; }
      if(rd.passagewayList && rd.passagewayList.length){
        S.pw = rd.passagewayList;
        /* 通道列表刷新后, SEL_PW 可能越界或指向已变通道: 重选空闲低单价路 */
        SEL_PW = 0;
        var _b = -1, _bp = Infinity;
        S.pw.forEach(function(pp, ii){
          if(Number(pp.status) === 2) return;
          var pr = Number(pp.waterCharge); if(!(pr >= 0)) pr = Infinity;
          if(pr < _bp){ _bp = pr; _b = ii; }
        });
        if(_b >= 0) SEL_PW = _b;
        log('re-scan 通道重选: #' + SEL_PW + ' ' + String(JSON.stringify(S.pw[SEL_PW])).slice(0, 120), 'w');
      }
    }else{
      log('re-scan 失败: code=' + rs.code + ' ' + (rs.msg || ''), 'e');
    }
  }catch(eS){ log('re-scan 异常: ' + eS.message, 'e'); }
  var awToken = S.bizToken || S.token;
  /* 官方 Ns() 展平后全是表单字符串: reqMap 内所有值按字符串发送, 数字字段
     (passagewaySettingId/chargeAreaId/useIntegral)一律 String 化 -- 服务端
     Spring 参数绑定对类型敏感, 混发数字会 code=1. */
  var req = {
    imei: String(S.imei),
    accountId: String(S.accountId),
    token: String(awToken),
    washerId: String(S.washerId),
    passagewaySettingId: String(pw.passagewaySettingId),
    passagewaySort: String(pw.passagewaySort || pw.passgetwaySort || 1),
    chargeAreaId: String(chargeArea),
    useIntegral: String(S.useIntegral2 ? 2 : 1)
  };
  if(S.assetId) req.assetId = S.assetId;
  log('unlock req: ' + JSON.stringify(req), 'w'); /* code=1 对照取证 */
  try{
    /* 官方 Vs = POST /distributor/unlock + reqMap[k]=v 表单展平(Ns()), 不是 goods/water/unlock.
       apiForm 的 reqMap 对象会自动展平(见其实现), 与官方形状完全一致. */
    /* 请求关键字段写进日志: 这四个是唯一会导致失败或串账的字段.
       出问题时先看这行, 就不用猜是通道不对还是扣费区不对. */
    log('unlock req: 通道=' + req.passagewaySettingId
        + ' 扣费区=' + req.chargeAreaId
        + ' 机器=' + String(req.washerId).slice(0, 12)
        + ' 积分=' + req.useIntegral
        + ' 卡=' + ((curCard && (curCard.name || curCard.areaId)) || '未定'), 'w');
    var j = await apiForm('distributor/unlock', {
      reqMap: req,
      imei: S.imei,
      distributorType: DIST,
      scanType: SCAN_T
    });
    /* 拆两行, 且 JSON 序列化单独 try: data 里若有循环引用, stringify 会抛错,
       整条日志就没了 -- 之前真机上 unlock 响应就是这么丢的. */
    log('unlock resp: code=' + j.code + ' msg=' + String(j.msg || '-'), 'w');
    try{
      log('unlock data: ' + JSON.stringify(j.data).slice(0, 300), 'w');
    }catch(eJ){ log('unlock data 无法序列化: ' + eJ.message, 'w'); }
    if(j.code===2128 && j.data && j.data.incompleteOrderId){
      /* 有未支付订单挡路: 取消它(POST /order/cancel)成功后自动重试出水. */
      var oid = j.data.incompleteOrderId;
      var ono = j.data.incompleteOrderNo || oid;
      log('2128 未支付订单挡路: ' + ono, 'w');
      modal({ title:'有一笔未支付订单挡路',
        body: '订单 <b>' + esc(ono) + '</b> 还没支付, 服务端不让开新单.'
          + '<br>取消它就立刻能出水(这笔本来也是要取消的).',
        actions:[
          { label:'取消那笔订单并出水', cls:'btn-p', fn:function(){
              closeModal();
              apiForm('order/cancel', { orderId: oid }).then(function(r2){
                if(r2.code===0){
                  log('挡路订单已取消: ' + ono, 's');
                  toast('已取消, 重新出水');
                  wUnlock();
                }else if(r2.code===3129){
                  alertBox('那笔订单不能取消',
                    '服务端说它"已消费". 如果这笔不是你的操作, 去正版 App 订单列表里看.');
                }else{
                  alertBox('取消失败', 'code=' + esc(String(r2.code)) + '<br>' + esc(r2.msg || ''));
                }
              }).catch(function(e){ alertBox('取消异常', esc(e.message)); });
            } },
          { label:'知道了' }
        ] });
      return;
    }
    if(j.code!==0){
      /* 28000 + msg=工作中: 这台机器已经在出水了(多半就是刚点这一下点亮的).
         真机实测: 弹"失败"时余额照样从 1.08 掉到 1.07, 水确实出来了.
         所以这里不能当失败, 直接进"出水中". */
      var jm = String(j.msg || '');
      if(Number(j.code) === 28000 && (jm.indexOf('工作') >= 0 || jm.indexOf('使用中') >= 0)){
        log('服务端回 28000/工作中 = 机器已在出水, 按已出水处理', 's');
        wStartPoll();
        return;
      }
      alertBox('出水没成功', uWErr(j.code, jm));
      return;
    }
    log('开阀成功, 返回=' + (typeof j.data === 'object' ? JSON.stringify(j.data) : j.data), 's');
    wStartPoll();   /* 内部会置 running 并重绘, 按钮直接变"出水中..." */
  }catch(e){ alertBox('出水异常', esc(e.message)); }
}
/* ===== 出水状态机 =====
   原则: 服务端接受开阀 = 已经在出水, 界面立刻显示"出水中", 不再等余额信号.
   余额只承担两件事:
     1) 算这次花了多少钱(出水按升计费, 每出一升余额就少一分)
     2) 判断结束(连续 4 次 / 12 秒余额完全不动 = 放完了)

   为什么不用 distributor/deviceStatus 的 deviceWorkStatus:
   真机直连实测它恒为 0(水已出了也是 0), 拿它做状态机必然误判.
*/
var S_BASE_BAL = null;      /* 开阀前该扣费卡的余额 */
var S_LAST_BAL = null;      /* 上一次读到的余额 */
var S_STILL = 0;            /* 连续"余额没变"的次数 */
var S_SPENT = 0;            /* 本次已花 */
var S_POLL_T0 = 0;
var S_SEEN_RUNNING = false;
var S_STILL_LIMIT = 12;     /* 连续 12 次(36 秒)不动 = 结束 */
var S_GRACE_MS = 60000;     /* 开阀后 60 秒内不判结束: 机器起泵 + 用户接水要时间 */

function wCurBal(){
  var c = (W.curArea !== null && W.curArea !== undefined) ? wCardOf(W.curArea) : null;
  return c ? Number(c.total || 0) : null;
}

function wStartPoll(){
  if(S.polling) return;
  S_SEEN_RUNNING = true;   /* 开阀被接受就是出水了 */
  S_STILL = 0;
  S_SPENT = 0;
  S_POLL_T0 = Date.now();
  S_BASE_BAL = wCurBal();
  S_LAST_BAL = S_BASE_BAL;
  S.phase = 'running';
  log('出水中, 基线余额 ' + (S_BASE_BAL === null ? '-' : S_BASE_BAL.toFixed(2)) + ' 元', 's');
  S.polling = setInterval(wPollOnce, 3000);
  if(CUR==='water') paint();
}

function wStopPoll(){
  if(S.polling){ clearInterval(S.polling); S.polling = 0; }
  S.phase = 'idle';
}

async function wPollOnce(){
  try{
    await wLoadAreas(true);          /* 静默刷新, 不刷屏 */
    var bal = wCurBal();
    if(bal === null) return;
    if(S_LAST_BAL === null){ S_LAST_BAL = bal; S_BASE_BAL = bal; }
    if(S_BASE_BAL !== null && bal < S_BASE_BAL - 0.001){
      S_SPENT = S_BASE_BAL - bal;
    }
    if(bal < S_LAST_BAL - 0.001){
      S_STILL = 0;
      S_LAST_BAL = bal;
      log('出水中, 已花 ' + S_SPENT.toFixed(2) + ' 元', 'w');
      if(CUR==='water') paint();
      return;
    }
    /* 余额没动 */
    S_LAST_BAL = bal;
    /* 开阀后一段宽限期内余额不动是正常的(机器还没起泵), 不累计. */
    if(Date.now() - S_POLL_T0 < S_GRACE_MS) return;
    S_STILL++;
    if(S_STILL >= S_STILL_LIMIT){
      wStopPoll();
      log('用水结束, 共花 ' + S_SPENT.toFixed(2) + ' 元', 's');
      toast('用水结束, 共花 ' + S_SPENT.toFixed(2) + ' 元');
      wLoadBalance();
      if(CUR==='water') paint();
    }
  }catch(e){ log('出水监测异常: ' + e.message, 'e'); }
}

/* 占用状态自动刷新: 取水页通道与机器列表都要"自己会变", 不能靠用户点刷新.
   两处都是静默模式(不写日志/不弹提示), 只在数值真的变了才重绘, 避免无意义 paint. */
var AUTO = { pwTimer:0, fmTimer:0, at:'', fmAt:'' };

/* 取水页: 每 8 秒重扫一次设备, 只更新通道占用与设备状态.
   重扫走 distributor/scan(与 wUnlock 同一个端点), 但不动 S.bizToken --
   awToken 是一次性的, 这里只借它的 deviceInfo/passagewayList 做展示. */
function wAutoPollPw(){
  if(AUTO.pwTimer) return;
  AUTO.pwTimer = setInterval(async function(){
    if(CUR !== 'water' || !S.token || !S.dev || S.polling) return;
    try{
      /* scan 可重复调用(每次给新 token, 不消耗配额), 8 秒一次安全, 不会顶掉点开水那次. */
      var rs = await apiForm('distributor/scan', { reqMap: { imei: S.imei, NQT: '' } });
      if(!rs || rs.code !== 0 || !rs.data) return;
      var rd = rs.data.result || rs.data;
      /* 字段名以实测为准: 通道列表是 waterPassageways(不是 passagewayList),
         设备状态在顶层 deviceStatus/deviceWorkStatus. 写错一个键名, 这段就永远静默不生效. */
      var pwList = rd.waterPassageways || rd.passagewayList || rd.passageways || null;
      /* 记下这一次成功的时刻: 界面上一眼能看出轮询在动, 而不是靠文案自称. */
      (function(){
        var d0 = new Date();
        var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
        AUTO.at = p2(d0.getHours()) + ':' + p2(d0.getMinutes()) + ':' + p2(d0.getSeconds());
        var el2 = $('wAutoAt');
        if(el2) el2.textContent = '自动刷新 ' + AUTO.at;
      })();
      var chg = false;
      if(pwList && pwList.length){
        var oldSig = (S.pw || []).map(function(p){ return p.status + ':' + p.waterCharge; }).join(',');
        var newSig = pwList.map(function(p){ return p.status + ':' + p.waterCharge; }).join(',');
        if(oldSig !== newSig){
          /* 状态真变了才动界面, 并留一行痕迹(否则用户以为界面是自己跳的). */
          var i2;
          for(i2=0; i2<pwList.length; i2++){
            var np = pwList[i2], op = (S.pw || [])[i2];
            if(op && Number(op.status) !== Number(np.status)){
              log('通道状态变化: ' + (np.passagewayName || ('通道' + (i2+1)))
                  + ' ' + (Number(op.status) === 2 ? '占用' : '空闲')
                  + ' -> ' + (Number(np.status) === 2 ? '占用' : '空闲'), 'w');
            }
          }
          S.pw = pwList;
          if(SEL_PW >= S.pw.length) SEL_PW = 0;
          chg = true;
        }
      }
      var ds = (rd.deviceStatus != null) ? rd.deviceStatus
             : (rd.deviceInfo ? rd.deviceInfo.deviceStatus : null);
      if(ds != null && Number(ds) !== Number(S.devStatus)){
        S.devStatus = Number(ds);
        chg = true;
      }
      /* 余额也可能被别人在同一账号下用掉, 顺手比一下 */
      if(rd.totalBalance != null && W.areas && W.areas.length){
        var tbNew = Number(rd.totalBalance);
        var tbOld = 0; W.areas.forEach(function(a){ tbOld += Number(a.total || 0); });
        if(Math.abs(tbNew - tbOld) > 0.004) chg = true;
      }
      if(chg && CUR === 'water') paint();
    }catch(e){}
  }, 8000);
}

/* 建筑内: 每 10 秒静默重拉一次机器列表, 刷新 空闲/使用中. */
function fmAutoPoll(){
  if(AUTO.fmTimer) return;
  AUTO.fmTimer = setInterval(async function(){
    if(CUR !== 'finder' && CUR !== 'laundry') return;
    if(!FM.cur || FM.devsBusy || !U.token) return;
    try{
      var sid = FM.cur.id || FM.cur.storeId;
      if(!sid) return;
      var u = '/api/v1/devices/reserve?storeId=' + sid;
      var jr = await ucall('GET', u, null, true);
      if(!jr || jr.code !== 0 || !jr.data) return;
      var arrR = Array.isArray(jr.data) ? jr.data : (jr.data.devices || jr.data.list || []);
      if(!arrR || !arrR.length) return;
      /* 记下这一刻, 界面上一眼能看出 10 秒轮询在动(不 paint, 只改这一个节点). */
      (function(){
        var d1 = new Date();
        var q = function(n){ return (n < 10 ? '0' : '') + n; };
        AUTO.fmAt = q(d1.getHours()) + ':' + q(d1.getMinutes()) + ':' + q(d1.getSeconds());
        var e1 = $('fmAutoAt');
        if(e1) e1.textContent = '自动刷新 ' + AUTO.fmAt;
      })();
      var changed = false;
      arrR.forEach(function(d){
        var dev = d.device || d;
        var tid = dev.deviceTypeId;
        var free = Number(dev.free != null ? dev.free : (Number(dev.total || 0) - Number(dev.usingCount || 0)));
        var total = Number(dev.total || 0);
        /* 只更新"汇总型"占位项(reserve 模式, 没有 deviceId 的那些) */
        FM.devs.forEach(function(x){
          if(x.reserveMode && String(x.deviceTypeId) === String(tid)){
            var ns = free > 0 ? (free + '/' + total + ' 台可约') : '无空闲';
            var nst = free > 0 ? 1 : 2;
            if(x.statusName !== ns || x.status !== nst){
              log('机器占用变化: ' + (x.deviceTypeName || '机器') + ' '
                  + (x.statusName || '?') + ' -> ' + ns, 'w');
              x.statusName = ns; x.status = nst;
              x.createOrderEnabled = free > 0;
              changed = true;
            }
            /* name 里带着台数(如"滚筒机 1/4 台"). 这个数字每轮都要校正:
               status 只在"空闲->使用中"那一瞬间变化, 只挂在那条分支里,
               name 就会永远停在变化那一刻的旧值, 和右侧状态打架. */
            var nn = (x.deviceTypeName || '洗衣机') + ' ' + free + '/' + total + ' 台';
            if(x.name !== nn){
              x.name = nn;
              changed = true;
            }
          }
        });
      });
      /* 有具体 deviceId 的机器(program/info 型)另拉一次 store/info 只更新计数 */
      if(!changed && FM.devs.length){
        var jt = await ucall('GET', '/api/v1/app/washer/store/info?storeId=' + sid, null, true);
        if(jt && jt.code === 0 && jt.data && jt.data.deviceTags){
          jt.data.deviceTags.forEach(function(tg){
            FM.devs.forEach(function(x){
              if(String(x.deviceTypeId) === String(tg.deviceTypeId) && x.reserveMode){
                var ns2 = Number(tg.idleNum) > 0
                  ? (tg.idleNum + '/' + tg.totalNum + ' 台可约') : '无空闲';
                if(x.statusName !== ns2){
                  x.statusName = ns2;
                  x.name = (x.deviceTypeName || '洗衣机') + ' '
                         + Number(tg.idleNum || 0) + '/' + Number(tg.totalNum || 0) + ' 台';
                  changed = true;
                }
              }
            });
          });
        }
      }
      if(changed) paint();
    }catch(e){}
  }, 10000);
}
